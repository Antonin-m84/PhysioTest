<style>
html,body{margin:0}
/* Layout: plein écran, canvas zoomable infini + barre haute + panneau détail latéral (feuille basse sur mobile). Thème sombre unique, choisi. */
:root{
  color-scheme: dark;
  --ink:#0c1316;        /* fond : anthracite bleuté */
  --ink-2:#121c20;      /* surfaces */
  --ink-3:#1a272c;      /* surfaces hautes */
  --line:#2a3a40;       /* traits */
  --fg:#e7efee;         /* texte */
  --fg-dim:#8fa3a3;     /* texte secondaire */
  --teal:#5fd3c3;       /* accent principal */
  --teal-deep:#1f5c56;
  --sand:#e6c58f;       /* décision / question */
  --coral:#ff7a6b;      /* red flag / urgence */
  --violet:#a99cf2;     /* sous-classification */
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body:"Manrope", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
html,body{height:100%;overflow:hidden}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-size:14px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

.app{position:relative;height:100%;display:flex;flex-direction:column}

/* ---------- Barre haute ---------- */
.top{position:relative;z-index:20;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,rgba(12,19,22,.96),rgba(12,19,22,.82));border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--teal);color:var(--ink);font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:-.02em}
.brand-name{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand-name span{color:var(--teal)}
.regions{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
.regions::-webkit-scrollbar{display:none}
.reg{flex:none;border:1px solid transparent;background:none;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--fg-dim);cursor:pointer}
a.reg{text-decoration:none;display:inline-flex;align-items:center}
a.reg:hover{color:var(--fg)}
.reg[aria-current="true"]{background:var(--ink-3);border-color:var(--line);color:var(--fg)}
.reg[disabled]{cursor:not-allowed;opacity:.55}
.reg small{font-family:var(--mono);font-size:10px;color:var(--fg-dim);margin-left:4px;letter-spacing:.04em}
.search{position:relative;flex:0 1 240px;min-width:160px}
.search input{width:100%;background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px 8px 32px;color:var(--fg);font:inherit;font-size:13px}
.search input::placeholder{color:var(--fg-dim)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--fg-dim)}

/* ---------- Canvas ---------- */
.stage{position:relative;flex:1;overflow:hidden;cursor:grab;touch-action:none;
  background-color:var(--ink);
  background-image:radial-gradient(circle at 1px 1px, rgba(95,211,195,.09) 1px, transparent 0);
  background-size:28px 28px}
.stage.dragging{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.edges path{fill:none;stroke:var(--line);stroke-width:2;transition:stroke .25s,opacity .25s}
.edges path.on{stroke:var(--teal);stroke-width:2.6}
.edges text{fill:var(--fg-dim);font-family:var(--mono);font-size:12px;font-weight:500}
.edges .lbl-bg{fill:var(--ink);stroke:var(--line);stroke-width:1}
.edges .yes{fill:var(--teal)}
.edges .no{fill:var(--coral)}
.edges g.on .lbl-bg{stroke:var(--teal)}

.node{position:absolute;transform:translate(-50%,-50%);width:250px;padding:14px 16px 14px;border-radius:14px;background:var(--ink-2);border:1px solid var(--line);
  cursor:pointer;text-align:left;transition:border-color .2s,box-shadow .2s,opacity .25s,transform .2s;user-select:none}
.node:hover{border-color:var(--fg-dim)}
.node .k{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-dim);margin-bottom:6px}
.node .k i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.node h3{margin:0;font-family:var(--display);font-weight:700;font-size:17px;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.node p{margin:6px 0 0;color:var(--fg-dim);font-size:12.5px;line-height:1.4}
.node .stat{margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--teal)}
.node.start{background:var(--teal);border-color:var(--teal);color:var(--ink);width:270px}
.node.start .k,.node.start p,.node.start .stat{color:rgba(12,19,22,.7)}
.node.question{border-color:rgba(230,197,143,.45)}
.node.question .k{color:var(--sand)}
.node.outcome{border-color:rgba(95,211,195,.5);background:linear-gradient(160deg,#14292a,var(--ink-2) 70%)}
.node.outcome .k{color:var(--teal)}
.node.danger{border-color:rgba(255,122,107,.6);background:linear-gradient(160deg,#2a1716,var(--ink-2) 70%)}
.node.danger .k{color:var(--coral)}
.node.sub{width:220px;border-style:dashed;border-color:rgba(169,156,242,.45)}
.node.sub .k{color:var(--violet)}
.node.sub h3{font-size:15px}
.node.sel{box-shadow:0 0 0 2px var(--teal),0 12px 40px rgba(0,0,0,.5);border-color:var(--teal)}
.node.path{border-color:var(--teal)}
.dim .node:not(.hit){opacity:.22}
.dim .edges path,.dim .edges g{opacity:.25}
.node.hit{box-shadow:0 0 0 2px var(--sand)}

/* ---------- Contrôles ---------- */
.ctrl{position:absolute;z-index:15;left:max(16px,calc(env(safe-area-inset-left,0px) + 16px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.ctrl button{width:40px;height:40px;border-radius:10px;background:var(--ink-2);border:1px solid var(--line);cursor:pointer;display:grid;place-items:center;font-size:18px}
.ctrl button:hover{border-color:var(--teal)}
.legend{position:absolute;z-index:15;left:max(72px,calc(env(safe-area-inset-left,0px) + 72px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;flex-wrap:wrap;
  padding:8px 12px;border-radius:10px;background:rgba(18,28,32,.9);border:1px solid var(--line);font-size:12px;color:var(--fg-dim);max-width:calc(100% - 100px)}
.legend span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.hint{position:absolute;z-index:15;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));padding:6px 12px;border-radius:999px;background:rgba(18,28,32,.9);border:1px solid var(--line);color:var(--fg-dim);font-size:12px;white-space:nowrap;transition:opacity .6s}

/* ---------- Panneau ---------- */
.panel{position:absolute;z-index:30;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--ink-2);border-left:1px solid var(--line);
  display:flex;flex-direction:column;transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:-20px 0 60px rgba(0,0,0,.35)}
.panel.open{transform:none}
.p-head{padding:20px 22px 14px;padding-right:max(22px,calc(env(safe-area-inset-right,0px) + 22px));border-bottom:1px solid var(--line)}
.p-close{position:absolute;top:14px;right:max(14px,calc(env(safe-area-inset-right,0px) + 14px));width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--ink);cursor:pointer;font-size:16px}
.crumbs{display:flex;flex-wrap:wrap;gap:4px 6px;font-size:11.5px;color:var(--fg-dim);margin:0 40px 10px 0}
.crumbs button{background:none;border:0;padding:0;color:var(--fg-dim);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.crumbs button:hover{color:var(--teal)}
.p-kind{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.p-title{margin:6px 0 0;font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
.p-body{flex:1;overflow-y:auto;padding:18px 22px 28px;padding-right:max(22px,calc(env(safe-area-inset-right,0px) + 22px));display:flex;flex-direction:column;gap:22px}
.p-body h4{margin:0 0 10px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-dim);font-weight:500}
.p-body p,.p-body li{line-height:1.55;font-size:14px;max-width:62ch}
.p-body p{margin:0}
.p-body ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.test{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--ink)}
.test + .test{margin-top:8px}
.test b{font-family:var(--display);font-size:15px;font-weight:700}
.test p{color:var(--fg-dim);font-size:13px;margin-top:4px}
.metrics{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.metric{font-family:var(--mono);font-size:11.5px;padding:3px 8px;border-radius:6px;background:var(--ink-3);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.metric em{font-style:normal;color:var(--fg-dim);margin-right:4px}
.metric.good{border-color:var(--teal-deep);color:var(--teal)}
.next{display:flex;flex-direction:column;gap:8px}
.go{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--ink);cursor:pointer;transition:border-color .2s,background .2s}
.go:hover{border-color:var(--teal);background:#10201f}
.go .tag{flex:none;font-family:var(--mono);font-size:11px;font-weight:500;padding:3px 8px;border-radius:6px;min-width:44px;text-align:center}
.go .tag.yes{background:rgba(95,211,195,.14);color:var(--teal)}
.go .tag.no{background:rgba(255,122,107,.14);color:var(--coral)}
.go .tag.sub{background:rgba(169,156,242,.14);color:var(--violet)}
.go span:last-child{font-weight:600;font-size:13.5px}
.src li{font-size:12.5px;color:var(--fg-dim)}
.old{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:5px;border:1px solid rgba(230,197,143,.4);color:var(--sand);margin-left:6px;white-space:nowrap}
.alert{border-left:3px solid var(--coral);padding:10px 12px;background:rgba(255,122,107,.07);border-radius:0 10px 10px 0;font-size:13.5px;line-height:1.5}
.disclaimer{font-size:11.5px;color:var(--fg-dim);border-top:1px solid var(--line);padding-top:14px}

@media (max-width:720px){
  .search{flex:1 1 100%;order:3}
  .panel{top:auto;width:100%;height:68%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(104%)}
  .panel.open{transform:none}
  .p-body{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
  .legend{display:none}
  .hint{font-size:11px;white-space:normal;max-width:220px;border-radius:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

,1646 C520,1672 640,1672 640,1698" data-e="25"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(640,1698) rotate(90)" data-e="25"></path><path d="M520,1646 C520,1774 280,1774 280,1902" data-e="26"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(280,1902) rotate(90)" data-e="26"></path><path d="M520,1646 C520,1777.5 520,1777.5 520,1909" data-e="27"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(520,1909) rotate(90)" data-e="27"></path><path d="M1125,1870 L1375,1870" data-e="28"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(1375,1870) rotate(0)" data-e="28"></path><g data-e="28"><rect class="lbl-bg" x="1228" y="1859" width="44" height="22" rx="11"></rect><text x="1250" y="1874" text-anchor="middle" class="yes">Oui</text></g><path d="M1000,1964.5 C1000,2024 1000,2024 1000,2083.5" data-e="29"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(1000,2083.5) rotate(90)" data-e="29"></path><g data-e="29"><rect class="lbl-bg" x="978" y="2013" width="44" height="22" rx="11"></rect><text x="1000" y="2028" text-anchor="middle" class="no">Non</text></g><path d="M1500,1925.5 C1500,1956.75 1310,1956.75 1310,1988" data-e="30"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(1310,1988) rotate(90)" data-e="30"></path><path d="M1500,1925.5 C1500,1956.75 1690,1956.75 1690,1988" data-e="31"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(1690,1988) rotate(90)" data-e="31"></path><path d="M1000,2216.5 C1000,2246.5 520,2246.5 520,2276.5" data-e="32"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(520,2276.5) rotate(90)" data-e="32"></path><path d="M1000,2216.5 C1000,2233.5 760,2233.5 760,2250.5" data-e="33"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(760,2250.5) rotate(90)" data-e="33"></path><path d="M1500,1345.5 C1500,1363.5 2445,1363.5 2445,1381.5" data-e="34"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(2445,1381.5) rotate(90)" data-e="34"></path><path d="M1500,1345.5 C1500,1368 2680,1368 2680,1390.5" data-e="35"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(2680,1390.5) rotate(90)" data-e="35"></path><path d="M1500,324.5 C1500,342.25 1310,342.25 1310,360" data-e="36"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(1310,360) rotate(90)" data-e="36"></path><path d="M1500,324.5 C1500,346.75 1690,346.75 1690,369" data-e="37"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(1690,369) rotate(90)" data-e="37"></path><path d="M520,525.5 C520,556.75 400,556.75 400,588" data-e="38"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(400,588) rotate(90)" data-e="38"></path><path d="M520,525.5 C520,556.75 640,556.75 640,588" data-e="39"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(640,588) rotate(90)" data-e="39"></path><path d="M520,525.5 C520,651.75 280,651.75 280,778" data-e="40"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(280,778) rotate(90)" data-e="40"></path><path d="M1500,815.5 C1500,834.25 2070,834.25 2070,853" data-e="41"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(2070,853) rotate(90)" data-e="41"></path><path d="M520,1065.5 C520,1096.75 640,1096.75 640,1128" data-e="42"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(640,1128) rotate(90)" data-e="42"></path><path d="M1000,2216.5 C1000,2237.75 1000,2237.75 1000,2259" data-e="43"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(1000,2259) rotate(90)" data-e="43"></path><path d="M1000,2216.5 C1000,2242.25 1240,2242.25 1240,2268" data-e="44"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(1240,2268) rotate(90)" data-e="44"></path><path d="M1000,2216.5 C1000,2242.25 1480,2242.25 1480,2268" data-e="45"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(1480,2268) rotate(90)" data-e="45"></path></svg>
    <button class="node start" data-id="start" style="left: 1000px; top: 80px;"><div class="k"><i></i>Point d'entrée</div><h3>Genou douloureux ou gênant</h3><p>Anamnèse avant tout test : mécanisme, gonflement (immédiat ou retardé), blocage, âge, activité.</p><div class="stat">2 tests · valeurs diagnostiques</div></button><button class="node question" data-id="rf" style="left: 1000px; top: 260px;"><div class="k"><i></i>Question 1</div><h3>Drapeaux rouges ?</h3><p>Fracture après trauma, genou chaud et fébrile, mollet suspect, douleur non mécanique.</p><div class="stat">1 test · valeurs diagnostiques</div></button><button class="node danger" data-id="rfEnd" style="left: 1500px; top: 260px;"><div class="k"><i></i>Orientation</div><h3>Orientation médicale</h3><p>Radio si Ottawa positive, urgences si infection, thrombose ou luxation suspectées.</p></button><button class="node sub" data-id="rfS1" style="left: 1310px; top: 450px;"><div class="k"><i></i>Genou chaud sans trauma</div><h3>Arthrite microcristalline ou inflammatoire</h3><p>Goutte, chondrocalcinose, rhumatisme inflammatoire. Gonflement chaud, raideur, parfois plusieurs articulations : avis médical.</p></button><button class="node sub" data-id="rfS2" style="left: 1690px; top: 450px;"><div class="k"><i></i>Coureur</div><h3>Fracture de fatigue</h3><p>Douleur osseuse localisée (tibia proximal), après une augmentation rapide de la charge. Douleur à l'appui, parfois la nuit : imagerie.</p></button><button class="node question" data-id="acl" style="left: 1000px; top: 470px;"><div class="k"><i></i>Question 2</div><h3>Lésion ligamentaire ?</h3><p>Pivot, choc en valgus ou en varus, choc sur le tibia genou fléchi. Craquement, gonflement, dérobement.</p><div class="stat">7 tests · valeurs diagnostiques</div></button><button class="node outcome" data-id="aclEnd" style="left: 520px; top: 470px;"><div class="k"><i></i>Tableau clinique</div><h3>Lésion ligamentaire</h3><p>Sous-classifier : quel ligament, lésion isolée ou associée, profil du patient.</p></button><button class="node sub" data-id="aclS1" style="left: 160px; top: 660px;"><div class="k"><i></i>Pivot central</div><h3>Rupture du LCA</h3><p>Rééducation dès la phase aiguë : contrôle de l'épanchement, extension complète, quadriceps. Avis chirurgical selon sport et instabilité.</p></button><button class="node sub" data-id="aclS3" style="left: 400px; top: 660px;"><div class="k"><i></i>Périphérique médial</div><h3>Entorse du LLI</h3><p>Choc en valgus. Douleur et laxité médiales. Lésion isolée : traitement fonctionnel en première intention.</p></button><button class="node sub" data-id="aclS4" style="left: 640px; top: 660px;"><div class="k"><i></i>Pivot central</div><h3>Lésion du LCP</h3><p>Choc sur le tibia genou fléchi (tableau de bord, chute à genoux). Tiroir postérieur, tibia qui « s'avale » à 90°.</p></button><button class="node sub" data-id="aclS5" style="left: 280px; top: 850px;"><div class="k"><i></i>Périphérique latéral</div><h3>Coin postéro-latéral</h3><p>Varus et rotation externe. Souvent associé au LCA ou au LCP : avis orthopédique rapide, à ne pas rater.</p></button><button class="node sub" data-id="aclS2" style="left: 520px; top: 850px;"><div class="k"><i></i>Sous-type</div><h3>Lésions associées</h3><p>LLI, ménisque, LCP ou coin postéro-latéral : examen complet et avis orthopédique plus rapide.</p></button><button class="node question" data-id="men" style="left: 1000px; top: 760px;"><div class="k"><i></i>Question 3</div><h3>Lésion méniscale ?</h3><p>Torsion en charge, gonflement retardé (6–24 h), blocage ou accrochage.</p><div class="stat">4 tests · valeurs diagnostiques</div></button><button class="node outcome" data-id="menEnd" style="left: 1500px; top: 760px;"><div class="k"><i></i>Tableau clinique</div><h3>Lésion méniscale</h3><p>Sous-classifier selon l'âge et le mécanisme.</p></button><button class="node sub" data-id="menS1" style="left: 1310px; top: 950px;"><div class="k"><i></i>Sous-type</div><h3>Traumatique (jeune, sportif)</h3><p>Torsion en charge, souvent associée au LCA. Avis orthopédique si blocage ou échec de la rééducation.</p></button><button class="node sub" data-id="menS2" style="left: 1690px; top: 950px;"><div class="k"><i></i>Sous-type</div><h3>Dégénérative (&gt; 40 ans)</h3><p>Début progressif, souvent associée à l'arthrose. Exercice et rééducation en première intention.</p></button><button class="node sub" data-id="menS3" style="left: 2070px; top: 950px;"><div class="k"><i></i>Ado, diagnostic différentiel</div><h3>Ostéochondrite disséquante</h3><p>Enfant ou ado sportif, douleur mal localisée, épanchement, parfois blocage par un fragment. Diagnostic par imagerie.</p></button><button class="node question" data-id="oa" style="left: 1000px; top: 1010px;"><div class="k"><i></i>Question 4</div><h3>Arthrose du genou ?</h3><p>45 ans ou plus, douleur à l'activité, raideur matinale de 30 min maximum.</p><div class="stat">1 test · valeurs diagnostiques</div></button><button class="node outcome" data-id="oaEnd" style="left: 520px; top: 1010px;"><div class="k"><i></i>Tableau clinique</div><h3>Gonarthrose</h3><p>Éducation, exercice et gestion du poids en première ligne.</p></button><button class="node sub" data-id="oaS" style="left: 400px; top: 1200px;"><div class="k"><i></i>Orienter le traitement</div><h3>Irritabilité et tolérance à la charge</h3><p>Doser l'exercice selon la douleur pendant et après l'effort, puis progresser.</p></button><button class="node sub" data-id="oaS2" style="left: 640px; top: 1200px;"><div class="k"><i></i>Plus de 60 ans</div><h3>Ostéonécrose du genou</h3><p>Douleur médiale brutale, souvent nocturne, sans trauma. Radio initiale souvent normale : avis médical, IRM.</p></button><button class="node question" data-id="tendo" style="left: 1000px; top: 1290px;"><div class="k"><i></i>Question 5</div><h3>Tendinopathie ou bursite ?</h3><p>Douleur très localisée sur un tendon et liée à la charge, ou gonflement localisé sur une bourse.</p><div class="stat">3 tests · valeurs diagnostiques</div></button><button class="node outcome" data-id="tendoEnd" style="left: 1500px; top: 1290px;"><div class="k"><i></i>Tableau clinique</div><h3>Tendinopathie ou bursite</h3><p>Sous-classifier par localisation, puis doser la charge.</p></button><button class="node sub" data-id="tS1" style="left: 1270px; top: 1480px;"><div class="k"><i></i>Antérieur bas</div><h3>Tendinopathie patellaire</h3><p>Pôle inférieur de la rotule, sauteur jeune. Douleur assis genou fléchi, souvent pire le lendemain des sauts.</p></button><button class="node sub" data-id="tS2" style="left: 1505px; top: 1480px;"><div class="k"><i></i>Antérieur haut</div><h3>Tendinopathie quadricipitale</h3><p>Pôle supérieur de la rotule. Plus rare : sauts, haltérophilie. Même logique de gestion de la charge.</p></button><button class="node sub" data-id="tS3" style="left: 1740px; top: 1480px;"><div class="k"><i></i>Latéral</div><h3>Bandelette ilio-tibiale (essuie-glace)</h3><p>Au-dessus de l'interligne latéral. Coureur ou cycliste, douleur qui arrive après une distance assez constante.</p></button><button class="node sub" data-id="tS4" style="left: 1975px; top: 1480px;"><div class="k"><i></i>Médial</div><h3>Patte d'oie (tendinobursite)</h3><p>Sous l'interligne médial, souvent avec une gonarthrose. La palpation est aussi douloureuse chez environ 30 % des personnes sans douleur.</p></button><button class="node sub" data-id="tS5" style="left: 2210px; top: 1480px;"><div class="k"><i></i>Postérieur</div><h3>Ischio-jambiers distaux et poplité</h3><p>Face postérieure ou postéro-latérale. Douleur en flexion contre résistance, en descente. Pas de test validé.</p></button><button class="node sub" data-id="tB1" style="left: 2445px; top: 1480px;"><div class="k"><i></i>Bursite antérieure</div><h3>Bursite prépatellaire</h3><p>Gonflement bien limité devant la rotule, souvent après des appuis répétés à genoux. Rouge, chaude, plaie ou fièvre : penser bursite septique (environ un cas sur trois), avis médical.</p></button><button class="node sub" data-id="tB2" style="left: 2680px; top: 1480px;"><div class="k"><i></i>Bursite postérieure</div><h3>Kyste poplité (Baker)</h3><p>Masse au creux poplité, souvent avec une arthrose ou une lésion méniscale. Rompu, il peut imiter une thrombose : la thrombose doit être éliminée par un médecin.</p></button><button class="node question" data-id="neuro" style="left: 1000px; top: 1580px;"><div class="k"><i></i>Question 6</div><h3>Douleur neuropathique ?</h3><p>Brûlure, décharges électriques, fourmillements, douleur au simple toucher, dans un territoire nerveux.</p><div class="stat">3 tests · valeurs diagnostiques</div></button><button class="node outcome" data-id="neuroEnd" style="left: 520px; top: 1580px;"><div class="k"><i></i>Tableau clinique</div><h3>Composante neuropathique</h3><p>Cartographier la zone, puis trouver le nerf ou la racine en cause.</p></button><button class="node sub" data-id="nS1" style="left: 160px; top: 1770px;"><div class="k"><i></i>Nerf périphérique</div><h3>Nerf saphène (branche infrapatellaire)</h3><p>Sous la rotule, face antéro-médiale. Fréquent après chirurgie (prothèse, arthroscopie) : engourdissement ou brûlure près de la cicatrice.</p></button><button class="node sub" data-id="nS2" style="left: 400px; top: 1770px;"><div class="k"><i></i>Nerf périphérique</div><h3>Nerf fibulaire commun</h3><p>Col de la fibula. Face latérale de jambe et dos du pied, faiblesse des releveurs. Tinel possible au col de la fibula.</p></button><button class="node sub" data-id="nS3" style="left: 640px; top: 1770px;"><div class="k"><i></i>Racine</div><h3>Radiculopathie L3–L4</h3><p>Face antérieure de cuisse, réflexe rotulien, quadriceps. Déficit qui s'aggrave : avis médical.</p></button><button class="node sub" data-id="nS4" style="left: 280px; top: 1990px;"><div class="k"><i></i>Après trauma ou chirurgie</div><h3>SDRC (algodystrophie)</h3><p>Douleur disproportionnée, changements de couleur, de température, de sudation, œdème. Diagnostic avec les critères de Budapest.</p></button><button class="node sub" data-id="nS5" style="left: 520px; top: 1990px;"><div class="k"><i></i>Gonarthrose</div><h3>Arthrose avec douleur de type neuropathique</h3><p>Environ 20 % des patients arthrosiques au painDETECT. À repérer pour adapter l'éducation et la progression.</p></button><button class="node question" data-id="hip" style="left: 1000px; top: 1870px;"><div class="k"><i></i>Question 7</div><h3>Douleur venant de la hanche ?</h3><p>Examiner la hanche devant toute douleur de genou atypique, surtout si l'examen du genou est presque normal.</p><div class="stat">3 tests · valeurs diagnostiques</div></button><button class="node outcome" data-id="hipEnd" style="left: 1500px; top: 1870px;"><div class="k"><i></i>Tableau clinique</div><h3>Contribution de la hanche</h3><p>Traiter la source, puis réévaluer le genou.</p></button><button class="node sub" data-id="hipS1" style="left: 1310px; top: 2060px;"><div class="k"><i></i>Adulte</div><h3>Coxarthrose</h3><p>Douleur de genou projetée depuis la hanche. Rotation interne limitée, douleur dans l'aine.</p></button><button class="node sub" data-id="hipS2" style="left: 1690px; top: 2060px;"><div class="k"><i></i>Adolescent</div><h3>Épiphysiolyse fémorale</h3><p>Ado qui boite, douleur de genou ou de cuisse, rotation interne de hanche limitée : radio de hanche en urgence.</p></button><button class="node outcome" data-id="pfp" style="left: 1000px; top: 2150px;"><div class="k"><i></i>Diagnostic d'exclusion</div><h3>Douleur fémoro-patellaire</h3><p>Douleur autour ou derrière la rotule, aggravée en charge genou fléchi.</p><div class="stat">2 tests · valeurs diagnostiques</div></button><button class="node sub" data-id="pfpS2" style="left: 520px; top: 2340px;"><div class="k"><i></i>Sous-type</div><h3>Instabilité patellaire</h3><p>Épisodes de subluxation ou luxation, appréhension en poussée latérale de la rotule.</p></button><button class="node sub" data-id="pfpS3" style="left: 760px; top: 2340px;"><div class="k"><i></i>Ado 10–15 ans</div><h3>Osgood-Schlatter</h3><p>Douleur et saillie de la tubérosité tibiale antérieure, sports avec sauts et sprints. Diagnostic clinique. Gestion de la charge et renforcement progressif.</p></button><button class="node sub" data-id="pfpS6" style="left: 1000px; top: 2340px;"><div class="k"><i></i>Enfant, ado</div><h3>Sinding-Larsen-Johansson</h3><p>Douleur au pôle inférieur de la rotule chez l'enfant ou l'ado : même logique que l'Osgood, à l'autre extrémité du tendon.</p></button><button class="node sub" data-id="pfpS7" style="left: 1240px; top: 2340px;"><div class="k"><i></i>Sous la rotule</div><h3>Coussinet adipeux (Hoffa)</h3><p>Douleur sous la rotule, de part et d'autre du tendon patellaire, aggravée en hyperextension. Pas de test validé.</p></button><button class="node sub" data-id="pfpS8" style="left: 1480px; top: 2340px;"><div class="k"><i></i>Antéro-médial</div><h3>Plica médio-patellaire</h3><p>Douleur antéro-médiale, parfois ressaut ou accrochage en flexion. Pas de test validé : diagnostic d'exclusion.</p></button></div>

function box(n){ return {x:n.x, y:n.y, w:n.el.offsetWidth, h:n.el.offsetHeight}; }
function drawEdges(){
  svg.innerHTML = "";
  E.forEach((e,i)=>{
    const a = box(byId[e[0]]), b = box(byId[e[1]]);
    let x1,y1,x2,y2,d;
    const horiz = Math.abs(a.y-b.y) < 40;
    if(horiz){
      const dir = b.x > a.x ? 1 : -1;
      x1 = a.x + dir*a.w/2; y1 = a.y; x2 = b.x - dir*b.w/2; y2 = b.y;
      d = `M${x1},${y1} L${x2},${y2}`;
    } else {
      x1 = a.x; y1 = a.y + a.h/2; x2 = b.x; y2 = b.y - b.h/2;
      const my = (y1+y2)/2;
      d = `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`;
    }
    const p = document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d",d); p.dataset.e = i; svg.appendChild(p);
    // flèche
    const ang = horiz ? (x2 > x1 ? 0 : 180) : 90;
    const ar = document.createElementNS("http://www.w3.org/2000/svg","path");
    ar.setAttribute("d","M-7,-5 L0,0 L-7,5"); ar.setAttribute("transform",`translate(${x2},${y2}) rotate(${ang})`);
    ar.dataset.e = i; svg.appendChild(ar);
    if(e[2] && e[2]!=="sub"){
      const g = document.createElementNS("http://www.w3.org/2000/svg","g"); g.dataset.e = i;
      const lx = horiz ? (x1+x2)/2 : (x1+x2)/2, ly = horiz ? y1 : (y1+y2)/2;
      const yes = e[2]==="Oui";
      g.innerHTML = `<rect class="lbl-bg" x="${lx-22}" y="${ly-11}" width="44" height="22" rx="11"/><text x="${lx}" y="${ly+4}" text-anchor="middle" class="${yes?"yes":"no"}">${e[2]}</text>`;
      svg.appendChild(g);
    }
  });
}

/* ---------- Pan / zoom ---------- */
let s = 1, tx = 0, ty = 0;
function apply(anim){
  world.style.transition = anim ? "transform .55s cubic-bezier(.2,.8,.2,1)" : "none";
  world.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
}
function clampS(v){ return Math.min(1.8, Math.max(.1, v)); }
function zoomAt(f, cx, cy, anim){
  const ns = clampS(s*f); const k = ns/s;
  tx = cx - (cx - tx)*k; ty = cy - (cy - ty)*k; s = ns; apply(anim);
}
function fit(anim){
  const r = stage.getBoundingClientRect();
  if(r.width < 720){ s = clampS(r.width/700); tx = r.width/2 - 1000*s; ty = 24 - 20*s; apply(anim); return; }
  const minX=0, minY=20, maxX=2820, maxY=2500;
  s = clampS(Math.min(r.width/(maxX-minX), r.height/(maxY-minY)) * .96);
  tx = (r.width - (maxX-minX)*s)/2 - minX*s;
  ty = (r.height - (maxY-minY)*s)/2 - minY*s;
  apply(anim);
}
function focusNode(id){
  const n = byId[id], r = stage.getBoundingClientRect();
  const panelW = window.innerWidth > 720 ? Math.min(440, r.width) : 0;
  const panelH = window.innerWidth <= 720 ? r.height*.68 : 0;
  s = Math.max(s, .75);
  tx = (r.width - panelW)/2 - n.x*s;
  ty = (r.height - panelH)/2 - n.y*s;
  apply(true);
}

const pts = new Map(); let moved = false, start = null, pinch = null;
stage.addEventListener("pointerdown", e=>{
  if(e.target.closest(".ctrl,.legend")) return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  moved = false; start = {x:e.clientX,y:e.clientY,tx,ty};
  if(pts.size===2){ const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y), s}; }
});
stage.addEventListener("pointermove", e=>{
  if(!pts.has(e.pointerId)) return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r = stage.getBoundingClientRect();
  if(pts.size===2 && pinch){
    const [a,b]=[...pts.values()];
    const d = Math.hypot(a.x-b.x,a.y-b.y);
    zoomAt((pinch.s*d/pinch.d)/s, (a.x+b.x)/2 - r.left, (a.y+b.y)/2 - r.top);
    if(!moved){ try{stage.setPointerCapture(e.pointerId);}catch(_){} } moved = true; return;
  }
  const dx = e.clientX-start.x, dy = e.clientY-start.y;
  if(Math.abs(dx)+Math.abs(dy) > 5){ if(!moved){ try{stage.setPointerCapture(e.pointerId);}catch(_){} } moved = true; stage.classList.add("dragging"); hideHint(); }
  if(moved){ tx = start.tx+dx; ty = start.ty+dy; apply(); }
});
function up(e){ pts.delete(e.pointerId); if(pts.size<2) pinch=null; stage.classList.remove("dragging");
  if(pts.size===1){ const p=[...pts.values()][0]; start={x:p.x,y:p.y,tx,ty}; }
  setTimeout(()=>{ if(!pts.size) moved=false; },0); }
stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
stage.addEventListener("wheel", e=>{ e.preventDefault(); hideHint();
  const r = stage.getBoundingClientRect();
  zoomAt(Math.exp(-e.deltaY*0.0015), e.clientX-r.left, e.clientY-r.top);
},{passive:false});
document.getElementById("zin").onclick = ()=>{ const r=stage.getBoundingClientRect(); zoomAt(1.25,r.width/2,r.height/2,true); };
document.getElementById("zout").onclick = ()=>{ const r=stage.getBoundingClientRect(); zoomAt(.8,r.width/2,r.height/2,true); };
document.getElementById("fit").onclick = ()=>fit(true);

function pathTo(id){ const p=[id]; let c=id; while(parents[c]){ c=parents[c][0]; p.unshift(c);} return p; }

function metricHTML(m){ return `<span class="metric${m[2]?" good":""}"><em>${m[0]}</em>${m[1]}</span>`; }
function srcHTML(k){ const o=SRC[k]; return `<li>${o.t}, ${o.y}${NOW-o.y>10?`<span class="old">étude fondatrice &gt;10 ans</span>`:""}</li>`; }

function select(id, focus){
  current = id;
  const n = byId[id], path = pathTo(id);
  document.querySelectorAll(".node").forEach(el=>{
    el.classList.toggle("sel", el.dataset.id===id);
    el.classList.toggle("path", path.includes(el.dataset.id) && el.dataset.id!==id);
  });
  const onEdges = new Set(); E.forEach((e,i)=>{ const ia=path.indexOf(e[0]); if(ia>=0 && path[ia+1]===e[1]) onEdges.add(String(i)); });
  svg.querySelectorAll("[data-e]").forEach(el=>el.classList.toggle("on", onEdges.has(el.dataset.e)));

  document.getElementById("crumbs").innerHTML = path.slice(0,-1).map(p=>`<button data-go="${p}">${byId[p].title}</button>`).join("<span>›</span>");
  const kc = {start:"var(--teal)",question:"var(--sand)",outcome:"var(--teal)",danger:"var(--coral)",sub:"var(--violet)"}[n.kind];
  const pk = document.getElementById("pkind"); pk.textContent = n.k; pk.style.color = kc;
  document.getElementById("ptitle").textContent = n.title;

  let h = "";
  if(n.p) h += `<p>${n.p}</p>`;
  if(n.alert) h += `<div class="alert">${n.alert}</div>`;
  if(n.tests) h += `<section><h4>Tests & valeurs diagnostiques</h4>${n.tests.map(t=>`<div class="test"><b>${t.n}</b><p>${t.h}</p>${t.m?`<div class="metrics">${t.m.map(metricHTML).join("")}</div>`:""}</div>`).join("")}</section>`;
  (n.body||[]).forEach(([t,items])=>{ h += `<section><h4>${t}</h4><ul>${items.map(i=>`<li>${i}</li>`).join("")}</ul></section>`; });
  const outs = E.filter(e=>e[0]===id);
  if(outs.length) h += `<section><h4>${n.kind==="question"?"Ta réponse":"Suite du raisonnement"}</h4><div class="next">${outs.map(e=>{
      const cls = e[2]==="Oui"?"yes":e[2]==="Non"?"no":"sub"; const lab = e[2]==="sub"?"Type":(e[2]||"Suite");
      return `<button class="go" data-go="${e[1]}"><span class="tag ${e[2]?cls:"yes"}">${lab}</span><span>${byId[e[1]].title}</span></button>`; }).join("")}</div></section>`;
  if(n.src) h += `<section class="src"><h4>Sources</h4><ul>${n.src.map(srcHTML).join("")}</ul></section>`;
  h += `<p class="disclaimer">Outil pédagogique d'aide au raisonnement clinique. Il ne remplace ni l'examen ni le jugement du praticien.</p>`;
  const body = document.getElementById("pbody"); body.innerHTML = h; body.scrollTop = 0;
  panel.classList.add("open");
  if(focus) focusNode(id);
  try{ history.replaceState(null,"","#"+id); }catch(_){}
}

  const v = norm(q.value.trim());

  stage.classList.toggle("dim", true);
  hits.forEach(id=>byId[id].el.classList.add("hit"));
});

function init(){
  drawEdges(); fit(false);
  const h = (location.hash||"").slice(1);
  if(byId[h]) setTimeout(()=>select(h,true),300);
  setTimeout(hideHint, 6000);
}
