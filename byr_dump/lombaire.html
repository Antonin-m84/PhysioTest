<style>
html,body{margin:0}
/* Layout: plein écran, canvas zoomable infini + barre haute + panneau détail latéral (feuille basse sur mobile). Thème sombre unique, choisi. */
:root{
  color-scheme: dark;
  --ink:#0c1316;        /* fond : anthracite bleuté */
  --ink-2:#121c20;      /* surfaces */
  --ink-3:#1a272c;      /* surfaces hautes */
  --line:#2a3a40;       /* traits */
  --fg:#e7efee;         /* texte */
  --fg-dim:#8fa3a3;     /* texte secondaire */
  --teal:#5fd3c3;       /* accent principal */
  --teal-deep:#1f5c56;
  --sand:#e6c58f;       /* décision / question */
  --coral:#ff7a6b;      /* red flag / urgence */
  --violet:#a99cf2;     /* sous-classification */
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body:"Manrope", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
html,body{height:100%;overflow:hidden}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-size:14px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

.app{position:relative;height:100%;display:flex;flex-direction:column}

/* ---------- Barre haute ---------- */
.top{position:relative;z-index:20;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,rgba(12,19,22,.96),rgba(12,19,22,.82));border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--teal);color:var(--ink);font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:-.02em}
.brand-name{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand-name span{color:var(--teal)}
.regions{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
.regions::-webkit-scrollbar{display:none}
.reg{flex:none;border:1px solid transparent;background:none;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--fg-dim);cursor:pointer}
a.reg{text-decoration:none;display:inline-flex;align-items:center}
a.reg:hover{color:var(--fg)}
.reg[aria-current="true"]{background:var(--ink-3);border-color:var(--line);color:var(--fg)}
.reg[disabled]{cursor:not-allowed;opacity:.55}
.reg small{font-family:var(--mono);font-size:10px;color:var(--fg-dim);margin-left:4px;letter-spacing:.04em}
.search{position:relative;flex:0 1 240px;min-width:160px}
.search input{width:100%;background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px 8px 32px;color:var(--fg);font:inherit;font-size:13px}
.search input::placeholder{color:var(--fg-dim)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--fg-dim)}

/* ---------- Canvas ---------- */
.stage{position:relative;flex:1;overflow:hidden;cursor:grab;touch-action:none;
  background-color:var(--ink);
  background-image:radial-gradient(circle at 1px 1px, rgba(95,211,195,.09) 1px, transparent 0);
  background-size:28px 28px}
.stage.dragging{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.edges path{fill:none;stroke:var(--line);stroke-width:2;transition:stroke .25s,opacity .25s}
.edges path.on{stroke:var(--teal);stroke-width:2.6}
.edges text{fill:var(--fg-dim);font-family:var(--mono);font-size:12px;font-weight:500}
.edges .lbl-bg{fill:var(--ink);stroke:var(--line);stroke-width:1}
.edges .yes{fill:var(--teal)}
.edges .no{fill:var(--coral)}
.edges g.on .lbl-bg{stroke:var(--teal)}

.node{position:absolute;transform:translate(-50%,-50%);width:250px;padding:14px 16px 14px;border-radius:14px;background:var(--ink-2);border:1px solid var(--line);
  cursor:pointer;text-align:left;transition:border-color .2s,box-shadow .2s,opacity .25s,transform .2s;user-select:none}
.node:hover{border-color:var(--fg-dim)}
.node .k{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-dim);margin-bottom:6px}
.node .k i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.node h3{margin:0;font-family:var(--display);font-weight:700;font-size:17px;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.node p{margin:6px 0 0;color:var(--fg-dim);font-size:12.5px;line-height:1.4}
.node .stat{margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--teal)}
.node.start{background:var(--teal);border-color:var(--teal);color:var(--ink);width:270px}
.node.start .k,.node.start p,.node.start .stat{color:rgba(12,19,22,.7)}
.node.question{border-color:rgba(230,197,143,.45)}
.node.question .k{color:var(--sand)}
.node.outcome{border-color:rgba(95,211,195,.5);background:linear-gradient(160deg,#14292a,var(--ink-2) 70%)}
.node.outcome .k{color:var(--teal)}
.node.danger{border-color:rgba(255,122,107,.6);background:linear-gradient(160deg,#2a1716,var(--ink-2) 70%)}
.node.danger .k{color:var(--coral)}
.node.sub{width:220px;border-style:dashed;border-color:rgba(169,156,242,.45)}
.node.sub .k{color:var(--violet)}
.node.sub h3{font-size:15px}
.node.sel{box-shadow:0 0 0 2px var(--teal),0 12px 40px rgba(0,0,0,.5);border-color:var(--teal)}
.node.path{border-color:var(--teal)}
.dim .node:not(.hit){opacity:.22}
.dim .edges path,.dim .edges g{opacity:.25}
.node.hit{box-shadow:0 0 0 2px var(--sand)}

/* ---------- Contrôles ---------- */
.ctrl{position:absolute;z-index:15;left:max(16px,calc(env(safe-area-inset-left,0px) + 16px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.ctrl button{width:40px;height:40px;border-radius:10px;background:var(--ink-2);border:1px solid var(--line);cursor:pointer;display:grid;place-items:center;font-size:18px}
.ctrl button:hover{border-color:var(--teal)}
.legend{position:absolute;z-index:15;left:max(72px,calc(env(safe-area-inset-left,0px) + 72px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;flex-wrap:wrap;
  padding:8px 12px;border-radius:10px;background:rgba(18,28,32,.9);border:1px solid var(--line);font-size:12px;color:var(--fg-dim);max-width:calc(100% - 100px)}
.legend span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.hint{position:absolute;z-index:15;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));padding:6px 12px;border-radius:999px;background:rgba(18,28,32,.9);border:1px solid var(--line);color:var(--fg-dim);font-size:12px;white-space:nowrap;transition:opacity .6s}

/* ---------- Panneau ---------- */
.panel{position:absolute;z-index:30;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--ink-2);border-left:1px solid var(--line);
  display:flex;flex-direction:column;transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:-20px 0 60px rgba(0,0,0,.35)}
.panel.open{transform:none}
.p-head{padding:20px 22px 14px;padding-right:max(22px,calc(env(safe-area-inset-right,0px) + 22px));border-bottom:1px solid var(--line)}
.p-close{position:absolute;top:14px;right:max(14px,calc(env(safe-area-inset-right,0px) + 14px));width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--ink);cursor:pointer;font-size:16px}
.crumbs{display:flex;flex-wrap:wrap;gap:4px 6px;font-size:11.5px;color:var(--fg-dim);margin:0 40px 10px 0}
.crumbs button{background:none;border:0;padding:0;color:var(--fg-dim);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.crumbs button:hover{color:var(--teal)}
.p-kind{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.p-title{margin:6px 0 0;font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
.p-body{flex:1;overflow-y:auto;padding:18px 22px 28px;padding-right:max(22px,calc(env(safe-area-inset-right,0px) + 22px));display:flex;flex-direction:column;gap:22px}
.p-body h4{margin:0 0 10px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-dim);font-weight:500}
.p-body p,.p-body li{line-height:1.55;font-size:14px;max-width:62ch}
.p-body p{margin:0}
.p-body ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.test{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--ink)}
.test + .test{margin-top:8px}
.test b{font-family:var(--display);font-size:15px;font-weight:700}
.test p{color:var(--fg-dim);font-size:13px;margin-top:4px}
.metrics{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.metric{font-family:var(--mono);font-size:11.5px;padding:3px 8px;border-radius:6px;background:var(--ink-3);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.metric em{font-style:normal;color:var(--fg-dim);margin-right:4px}
.metric.good{border-color:var(--teal-deep);color:var(--teal)}
.next{display:flex;flex-direction:column;gap:8px}
.go{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--ink);cursor:pointer;transition:border-color .2s,background .2s}
.go:hover{border-color:var(--teal);background:#10201f}
.go .tag{flex:none;font-family:var(--mono);font-size:11px;font-weight:500;padding:3px 8px;border-radius:6px;min-width:44px;text-align:center}
.go .tag.yes{background:rgba(95,211,195,.14);color:var(--teal)}
.go .tag.no{background:rgba(255,122,107,.14);color:var(--coral)}
.go .tag.sub{background:rgba(169,156,242,.14);color:var(--violet)}
.go span:last-child{font-weight:600;font-size:13.5px}
.src li{font-size:12.5px;color:var(--fg-dim)}
.old{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:5px;border:1px solid rgba(230,197,143,.4);color:var(--sand);margin-left:6px;white-space:nowrap}
.alert{border-left:3px solid var(--coral);padding:10px 12px;background:rgba(255,122,107,.07);border-radius:0 10px 10px 0;font-size:13.5px;line-height:1.5}
.disclaimer{font-size:11.5px;color:var(--fg-dim);border-top:1px solid var(--line);padding-top:14px}

@media (max-width:720px){
  .search{flex:1 1 100%;order:3}
  .panel{top:auto;width:100%;height:68%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(104%)}
  .panel.open{transform:none}
  .p-body{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
  .legend{display:none}
  .hint{font-size:11px;white-space:normal;max-width:220px;border-radius:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(1375,2030) rotate(0)" data-e="37"></path><g data-e="37"><rect class="lbl-bg" x="1228" y="2019" width="44" height="22" rx="11"></rect><text x="1250" y="2034" text-anchor="middle" class="yes">Oui</text></g><path d="M1000,2126 C1000,2186 1000,2186 1000,2246" data-e="38"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(1000,2246) rotate(90)" data-e="38"></path><g data-e="38"><rect class="lbl-bg" x="978" y="2175" width="44" height="22" rx="11"></rect><text x="1000" y="2190" text-anchor="middle" class="no">Non</text></g><path d="M1500,2106 C1500,2122.5 1260,2122.5 1260,2139" data-e="39"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(1260,2139) rotate(90)" data-e="39"></path><path d="M1500,2106 C1500,2122.5 1500,2122.5 1500,2139" data-e="40"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(1500,2139) rotate(90)" data-e="40"></path><path d="M1500,2106 C1500,2127 1740,2127 1740,2148" data-e="41"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(1740,2148) rotate(90)" data-e="41"></path><path d="M1000,2414 C1000,2435.25 280,2435.25 280,2456.5" data-e="42"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(280,2456.5) rotate(90)" data-e="42"></path><path d="M1000,2414 C1000,2435.25 520,2435.25 520,2456.5" data-e="43"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(520,2456.5) rotate(90)" data-e="43"></path><path d="M1000,2414 C1000,2422.25 760,2422.25 760,2430.5" data-e="44"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(760,2430.5) rotate(90)" data-e="44"></path><path d="M1000,2414 C1000,2426.5 1240,2426.5 1240,2439" data-e="45"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(1240,2439) rotate(90)" data-e="45"></path><path d="M1000,2414 C1000,2426.5 1480,2426.5 1480,2439" data-e="46"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(1480,2439) rotate(90)" data-e="46"></path><path d="M1000,2414 C1000,2435.25 1720,2435.25 1720,2456.5" data-e="47"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(1720,2456.5) rotate(90)" data-e="47"></path><path d="M1000,2414 C1000,2518 1000,2518 1000,2622" data-e="48"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(1000,2622) rotate(90)" data-e="48"></path><path d="M1000,2414 C1000,2512.5 1240,2512.5 1240,2611" data-e="49"></path><path d="M-7,-5 L0,0 L-7,5" transform="translate(1240,2611) rotate(90)" data-e="49"></path></svg>
    <button class="node start" data-id="start" style="left: 1000px; top: 80px;"><div class="k"><i></i>Point d'entrée</div><h3>Lombalgie ou douleur irradiée</h3><p>Anamnèse avant tout test : début, trauma, douleur de jambe, horaire, âge, terrain.</p></button><button class="node question" data-id="rf" style="left: 1000px; top: 260px;"><div class="k"><i></i>Question 1</div><h3>Drapeaux rouges ?</h3><p>Queue de cheval, fracture, cancer, infection, douleur viscérale ou vasculaire.</p><div class="stat">5 tests · valeurs diagnostiques</div></button><button class="node danger" data-id="rfEnd" style="left: 1500px; top: 260px;"><div class="k"><i></i>Orientation</div><h3>Orientation médicale</h3><p>Urgences pour la queue de cheval, l'infection, l'anévrisme ou un déficit qui s'aggrave.</p></button><button class="node sub" data-id="rfS1" style="left: 1260px; top: 450px;"><div class="k"><i></i>Urgence</div><h3>Syndrome de la queue de cheval</h3><p>Anesthésie en selle, troubles urinaires ou fécaux, sciatique bilatérale. IRM en urgence.</p></button><button class="node sub" data-id="rfS2" style="left: 1500px; top: 450px;"><div class="k"><i></i>Ostéoporose, trauma</div><h3>Fracture vertébrale / tassement</h3><p>Trauma parfois minime chez la personne âgée ou sous corticoïdes. Imagerie.</p><div class="stat">2 tests · valeurs diagnostiques</div></button><button class="node sub" data-id="rfS3" style="left: 1740px; top: 450px;"><div class="k"><i></i>Antécédent de cancer</div><h3>Métastase ou tumeur</h3><p>Douleur progressive, nocturne, non mécanique, amaigrissement. Avis médical et imagerie rapides.</p></button><button class="node sub" data-id="rfS4" style="left: 1260px; top: 640px;"><div class="k"><i></i>Fièvre, terrain</div><h3>Spondylodiscite</h3><p>Douleur intense permanente, fièvre parfois absente, terrain fragile ou geste récent : urgences.</p></button><button class="node sub" data-id="rfS5" style="left: 1500px; top: 640px;"><div class="k"><i></i>Vasculaire, viscéral</div><h3>Anévrisme, rein, pancréas</h3><p>Douleur non mécanique, non modifiée par le mouvement. Masse pulsatile, signes urinaires ou digestifs : urgences.</p></button><button class="node sub" data-id="rfS6" style="left: 1740px; top: 640px;"><div class="k"><i></i>Enfant</div><h3>Lombalgie de l'enfant de moins de 10 ans</h3><p>Rare à cet âge : penser infection (discite), tumeur, ostéome ostéoïde (scoliose douloureuse, douleur nocturne). Avis médical.</p></button><button class="node question" data-id="spa" style="left: 1000px; top: 540px;"><div class="k"><i></i>Question 2</div><h3>Rachialgie inflammatoire ?</h3><p>Début avant 40 ans, réveils en fin de nuit, raideur matinale longue, mieux en bougeant.</p><div class="stat">2 tests · valeurs diagnostiques</div></button><button class="node outcome" data-id="spaEnd" style="left: 520px; top: 540px;"><div class="k"><i></i>Tableau clinique</div><h3>Spondyloarthrite axiale suspectée</h3><p>Orientation vers le médecin ou le rhumatologue, et rééducation par l'exercice en parallèle.</p></button><button class="node sub" data-id="spaS1" style="left: 400px; top: 730px;"><div class="k"><i></i>Adulte jeune</div><h3>Spondyloarthrite axiale</h3><p>Lombalgie ou fessalgie à bascule, raideur matinale, réveils nocturnes. Diagnostic rhumatologique.</p></button><button class="node sub" data-id="spaS2" style="left: 640px; top: 730px;"><div class="k"><i></i>Ado</div><h3>Spondyloarthrite juvénile</h3><p>Ado avec talalgie, enthésites, douleur fessière ou lombaire nocturne. Avis pédiatrique ou rhumatologique.</p></button><button class="node question" data-id="radic" style="left: 1000px; top: 830px;"><div class="k"><i></i>Question 3</div><h3>Douleur radiculaire ?</h3><p>Douleur de jambe, souvent plus forte que la douleur du dos, dans un territoire de racine. Fourmillements, engourdissement.</p><div class="stat">7 tests · valeurs diagnostiques</div></button><button class="node outcome" data-id="radicEnd" style="left: 1500px; top: 830px;"><div class="k"><i></i>Tableau clinique</div><h3>Radiculopathie lombaire</h3><p>Identifier la racine, puis suivre l'évolution neurologique.</p></button><button class="node sub" data-id="radS1" style="left: 1260px; top: 1020px;"><div class="k"><i></i>Racine L5</div><h3>Sciatique L5</h3><p>Face latérale de jambe, dos du pied, gros orteil. Faiblesse de l'extenseur de l'hallux et des releveurs.</p></button><button class="node sub" data-id="radS2" style="left: 1500px; top: 1020px;"><div class="k"><i></i>Racine S1</div><h3>Sciatique S1</h3><p>Face postérieure de jambe, plante et bord latéral du pied. Réflexe achilléen diminué, faiblesse sur pointe de pied.</p></button><button class="node sub" data-id="radS3" style="left: 1740px; top: 1020px;"><div class="k"><i></i>Racines L2–L4</div><h3>Cruralgie</h3><p>Face antérieure de cuisse, parfois jusqu'au genou. Réflexe rotulien diminué, test d'étirement fémoral positif.</p></button><button class="node sub" data-id="radS4" style="left: 1260px; top: 1210px;"><div class="k"><i></i>Ado sportif</div><h3>Hernie discale de l'adolescent</h3><p>Raideur importante, Lasègue souvent très positif, attitude antalgique. Moins de douleur que chez l'adulte.</p></button><button class="node sub" data-id="radS5" style="left: 1500px; top: 1210px;"><div class="k"><i></i>Nerf périphérique</div><h3>Méralgie paresthésique</h3><p>Brûlure ou engourdissement de la face latérale de cuisse, sans déficit moteur. Nerf cutané latéral de la cuisse. Pas de test validé.</p></button><button class="node sub" data-id="radS6" style="left: 1740px; top: 1210px;"><div class="k"><i></i>Fesse</div><h3>Douleur fessière profonde (piriforme)</h3><p>Douleur fessière, parfois irradiée, assis prolongé. Diagnostic d'exclusion d'une radiculopathie. Pas de test validé.</p></button><button class="node question" data-id="sten" style="left: 1000px; top: 1130px;"><div class="k"><i></i>Question 4</div><h3>Sténose du canal lombaire ?</h3><p>Plus de 50 ans, douleurs de jambes à la marche ou debout, soulagées assis ou penché en avant.</p><div class="stat">6 tests · valeurs diagnostiques</div></button><button class="node outcome" data-id="stenEnd" style="left: 520px; top: 1130px;"><div class="k"><i></i>Tableau clinique</div><h3>Sténose du canal lombaire</h3><p>Exercice en flexion, marche fractionnée, vélo, éducation.</p></button><button class="node sub" data-id="stS1" style="left: 400px; top: 1320px;"><div class="k"><i></i>Sous-type</div><h3>Sténose centrale</h3><p>Claudication neurogène bilatérale, soulagement assis ou penché en avant.</p></button><button class="node sub" data-id="stS2" style="left: 640px; top: 1320px;"><div class="k"><i></i>Sous-type</div><h3>Sténose foraminale ou latérale</h3><p>Douleur radiculaire unilatérale, souvent en extension et rotation du même côté. Même logique que la question 3.</p></button><button class="node sub" data-id="stS3" style="left: 160px; top: 1320px;"><div class="k"><i></i>Diagnostic différentiel</div><h3>Claudication vasculaire</h3><p>Mollet surtout, soulagée à l'arrêt debout, pouls diminués, terrain vasculaire. Avis médical.</p></button><button class="node sub" data-id="stS4" style="left: 520px; top: 1510px;"><div class="k"><i></i>Plus de 50 ans</div><h3>Spondylolisthésis dégénératif</h3><p>Souvent L4–L5, chez la femme de plus de 50 ans. Peut donner une sténose. Diagnostic par imagerie si besoin.</p></button><button class="node question" data-id="sij" style="left: 1000px; top: 1440px;"><div class="k"><i></i>Question 5</div><h3>Douleur sacro-iliaque ?</h3><p>Douleur sous L5, en regard de l'épine iliaque postéro-supérieure, montrée du doigt. Grossesse, post-partum.</p><div class="stat">3 tests · valeurs diagnostiques</div></button><button class="node outcome" data-id="sijEnd" style="left: 1500px; top: 1440px;"><div class="k"><i></i>Tableau clinique</div><h3>Douleur sacro-iliaque ou de la ceinture pelvienne</h3><p>Éducation, exercices de contrôle et de renforcement, gestion de la charge.</p></button><button class="node sub" data-id="sijS1" style="left: 1260px; top: 1630px;"><div class="k"><i></i>Adulte</div><h3>Douleur sacro-iliaque</h3><p>Douleur unilatérale sous L5, sans centralisation, au moins 3 tests de provocation positifs.</p></button><button class="node sub" data-id="sijS2" style="left: 1500px; top: 1630px;"><div class="k"><i></i>Grossesse, post-partum</div><h3>Douleur de la ceinture pelvienne</h3><p>Douleur sacro-iliaque ou symphysaire, au retournement au lit, à la marche, en appui unipodal. Test P4.</p></button><button class="node sub" data-id="sijS3" style="left: 1740px; top: 1630px;"><div class="k"><i></i>Inflammatoire</div><h3>Sacro-iliite</h3><p>Fessalgie à bascule, réveils nocturnes, raideur matinale : profil de spondyloarthrite, voir la question 2.</p></button><button class="node question" data-id="hip" style="left: 1000px; top: 1730px;"><div class="k"><i></i>Question 6</div><h3>Douleur venant de la hanche ?</h3><p>Douleur fessière, de l'aine ou de la cuisse. Examiner la hanche si le rachis ne reproduit pas la douleur.</p><div class="stat">4 tests · valeurs diagnostiques</div></button><button class="node outcome" data-id="hipEnd" style="left: 520px; top: 1730px;"><div class="k"><i></i>Tableau clinique</div><h3>Contribution de la hanche</h3><p>Bilan complet de la hanche, puis réévaluer le dos.</p></button><button class="node sub" data-id="hipS1" style="left: 160px; top: 1920px;"><div class="k"><i></i>Plus de 50 ans</div><h3>Coxarthrose</h3><p>Douleur de l'aine ou fessière, rotation interne limitée, raideur matinale courte.</p></button><button class="node sub" data-id="hipS2" style="left: 400px; top: 1920px;"><div class="k"><i></i>Douleur latérale</div><h3>Tendinopathie fessière</h3><p>Douleur latérale de hanche, couché sur le côté, en montée d'escaliers, appui unipodal. Souvent confondue avec une lombalgie.</p></button><button class="node sub" data-id="hipS3" style="left: 640px; top: 1920px;"><div class="k"><i></i>Adolescent</div><h3>Épiphysiolyse fémorale</h3><p>Ado qui boite, douleur de cuisse ou de genou, rotation interne de hanche limitée : radio de hanche en urgence.</p></button><button class="node question" data-id="noci" style="left: 1000px; top: 2030px;"><div class="k"><i></i>Question 7</div><h3>Composante nociplastique ou psychosociale ?</h3><p>Douleur diffuse, disproportionnée, hypersensibilité, fatigue, sommeil perturbé, peur de bouger.</p><div class="stat">3 tests · valeurs diagnostiques</div></button><button class="node outcome" data-id="nociEnd" style="left: 1500px; top: 2030px;"><div class="k"><i></i>Tableau clinique</div><h3>Composante nociplastique ou psychosociale</h3><p>Éducation à la douleur, exercice progressif, lien avec le médecin.</p></button><button class="node sub" data-id="nS1" style="left: 1260px; top: 2220px;"><div class="k"><i></i>STarT Back élevé</div><h3>Risque élevé de chronicité</h3><p>Peur, catastrophisme, humeur basse. Approche cognitive et fonctionnelle, réassurance, activité progressive.</p></button><button class="node sub" data-id="nS2" style="left: 1500px; top: 2220px;"><div class="k"><i></i>Douleur diffuse</div><h3>Fibromyalgie ou douleur diffuse</h3><p>Douleurs multisites, fatigue, sommeil non réparateur. Diagnostic médical, exercice adapté.</p></button><button class="node sub" data-id="nS3" style="left: 1740px; top: 2220px;"><div class="k"><i></i>Plus de 3 mois</div><h3>Lombalgie chronique</h3><p>Les facteurs psychosociaux pèsent plus que l'imagerie. Exercice, éducation, reprise d'activité.</p></button><button class="node outcome" data-id="lc" style="left: 1000px; top: 2330px;"><div class="k"><i></i>Diagnostic d'exclusion</div><h3>Lombalgie commune</h3><p>Aucun drapeau rouge, pas de radiculopathie, de sténose, de profil inflammatoire ou de source extra-rachidienne.</p><div class="stat">1 test · valeurs diagnostiques</div></button><button class="node sub" data-id="lcS1" style="left: 280px; top: 2520px;"><div class="k"><i></i>Sous-type</div><h3>Préférence directionnelle</h3><p>Une direction de mouvement centralise ou diminue la douleur : elle guide les exercices.</p></button><button class="node sub" data-id="lcS2" style="left: 520px; top: 2520px;"><div class="k"><i></i>Moins de 6 semaines</div><h3>Lombalgie aiguë</h3><p>Évolution le plus souvent favorable. Rassurer, rester actif, pas d'imagerie.</p></button><button class="node sub" data-id="lcS3" style="left: 760px; top: 2520px;"><div class="k"><i></i>Extension, rotation</div><h3>Douleur facettaire</h3><p>Douleur en extension et rotation, sans irradiation sous le genou. Aucun test clinique validé : diagnostic d'exclusion. L'arthrose facettaire à l'imagerie ne suffit pas à le poser.</p></button><button class="node sub" data-id="lcS4" style="left: 1240px; top: 2520px;"><div class="k"><i></i>Ado sportif</div><h3>Spondylolyse</h3><p>Ado en sport d'hyperextension (gym, danse, foot), douleur en extension. Aucun test physique fiable, l'extension unipodale non plus : imagerie si suspicion.</p></button><button class="node sub" data-id="lcS5" style="left: 1480px; top: 2520px;"><div class="k"><i></i>Ado, adulte jeune</div><h3>Spondylolisthésis isthmique</h3><p>Une « marche d'escalier » à la palpation des épineuses oriente vers un spondylolisthésis (Se 60–88 %, Sp 87–100 %).</p></button><button class="node sub" data-id="lcS6" style="left: 1720px; top: 2520px;"><div class="k"><i></i>Ado</div><h3>Maladie de Scheuermann</h3><p>Cyphose raide, douleur thoracolombaire à l'effort chez l'ado. Radio de profil.</p></button><button class="node sub" data-id="lcS8" style="left: 1240px; top: 2710px;"><div class="k"><i></i>Compte rendu d'imagerie</div><h3>Discopathie ou arthrose à l'imagerie</h3><p>Très fréquentes chez les personnes sans douleur : elles n'expliquent pas à elles seules la lombalgie.</p><div class="stat">1 test · valeurs diagnostiques</div></button><button class="node sub" data-id="lcS7" style="left: 1000px; top: 2710px;"><div class="k"><i></i>Charnière thoraco-lombaire</div><h3>Syndrome de Maigne</h3><p>Douleur lombaire basse ou de la crête iliaque, avec origine haute (T11–L1). Concept français fréquent en cabinet, sans test validé.</p></button></div>

  src:["has","nice","finucane"]},

 {id:"rf", kind:"question", x:1000, y:260, k:"Question 1", title:"Drapeaux rouges ?",

         {n:"Contusion ou abrasion (après trauma)", h:"Trace visible d'un choc sur le rachis. Probabilité de fracture après un test positif.", m:[["Proba post-test","62 %",1]], s:"downie"},

  body:[["À rechercher systématiquement",["Queue de cheval : anesthésie en selle, troubles urinaires ou fécaux récents, sciatique bilatérale, faiblesse qui progresse.","Fracture : trauma important, ou trauma minime avec ostéoporose, corticoïdes, âge avancé.","Cancer : antécédent de cancer, amaigrissement inexpliqué, douleur nocturne non mécanique, plus de 50 ans.","Infection (spondylodiscite) : fièvre, toxicomanie IV, immunodépression, infection ou geste rachidien récent.","Vasculaire ou viscéral : douleur non mécanique, pulsatile, homme de plus de 60 ans fumeur (anévrisme de l'aorte), douleur liée aux repas ou à la miction.","Enfant de moins de 10 ans, douleur constante ou nocturne : toujours un avis médical."]]],

 {id:"rfS1", kind:"sub", x:1260, y:450, k:"Urgence", title:"Syndrome de la queue de cheval",

 {id:"rfS2", kind:"sub", x:1500, y:450, k:"Ostéoporose, trauma", title:"Fracture vertébrale / tassement",

         {n:"Signe du décubitus (supine sign)", h:"Le patient ne peut pas s'allonger à plat sur le dos, même avec un oreiller, à cause de la douleur rachidienne. Même étude que ci-dessus.", m:[["Se","81 %"],["Sp","93 %",1]], s:"langdon"}],
  body:[["Qui suspecter ?",["Âge avancé, surtout la femme ménopausée.","Corticothérapie prolongée.","Trauma important, ou trauma minime sur terrain ostéoporotique.","Contusion ou abrasion : la combinaison de plusieurs signes augmente la probabilité (Downie 2013)."]],["Conduite",["Suspicion : avis médical et imagerie avant toute rééducation.","Tassement stable confirmé : antalgie, mobilisation précoce, renforcement des extenseurs, travail de l'équilibre et prévention des chutes.","Penser au bilan d'ostéoporose avec le médecin."]]],
  src:["downie","langdon"]},
 {id:"rfS3", kind:"sub", x:1740, y:450, k:"Antécédent de cancer", title:"Métastase ou tumeur",

 {id:"rfS4", kind:"sub", x:1260, y:640, k:"Fièvre, terrain", title:"Spondylodiscite",

 {id:"rfS5", kind:"sub", x:1500, y:640, k:"Vasculaire, viscéral", title:"Anévrisme, rein, pancréas",

 {id:"rfS6", kind:"sub", x:1740, y:640, k:"Enfant", title:"Lombalgie de l'enfant de moins de 10 ans",

 {id:"spa", kind:"question", x:1000, y:540, k:"Question 2", title:"Rachialgie inflammatoire ?",

  tests:[{n:"Critères ASAS de lombalgie inflammatoire", h:"Lombalgie depuis plus de 3 mois. Positif si au moins 4 critères sur 5 : âge de début avant 40 ans, début insidieux, amélioration par l'exercice, pas d'amélioration au repos, douleur nocturne qui s'améliore au lever. Valeurs de l'étude initiale (ateliers d'experts), plus faibles dans la cohorte de validation (Se 79,6 %, Sp 72,4 %).", m:[["Se","77 %"],["Sp","91,7 %",1]], s:"sieper"},
         {n:"Lombalgie inflammatoire en consultation spécialisée", h:"Patients adressés en rhumatologie : quels que soient les critères utilisés, la lombalgie inflammatoire seule augmente peu la probabilité de spondyloarthrite. Il faut l'associer aux autres signes (uvéite, psoriasis, enthésite, antécédents familiaux, HLA-B27, CRP).", m:[["Se","74–81 %"],["Sp","25–44 %"],["LR+","1,1–1,4"]], s:"poddubnyy"}],
  body:[["Signes associés qui renforcent la suspicion",["Uvéite, psoriasis, maladie inflammatoire de l'intestin.","Talalgie ou enthésite, doigt ou orteil « en saucisse ».","Antécédents familiaux de spondyloarthrite.","Bonne réponse aux anti-inflammatoires."]],["Interprétation",["Le kiné n'a pas à poser le diagnostic : il repère le profil et oriente.","Les critères ASAS de classification (avec imagerie et HLA-B27) relèvent du rhumatologue."]]],
  src:["sieper","poddubnyy","sepriano"]},
 {id:"spaEnd", kind:"outcome", x:520, y:540, k:"Tableau clinique", title:"Spondyloarthrite axiale suspectée",

 {id:"spaS1", kind:"sub", x:400, y:730, k:"Adulte jeune", title:"Spondyloarthrite axiale",

 {id:"spaS2", kind:"sub", x:640, y:730, k:"Ado", title:"Spondyloarthrite juvénile",

 {id:"radic", kind:"question", x:1000, y:830, k:"Question 3", title:"Douleur radiculaire ?",

  tests:[{n:"Lasègue (élévation jambe tendue)", h:"Patient couché, élévation passive de la jambe tendue. Positif si la douleur de jambe est reproduite entre 30° et 70°. Très sensible en population chirurgicale, peu spécifique.", m:[["Se","92 %",1],["Sp","28 %"]], s:"windt"},
         {n:"Lasègue : étude récente", h:"Étude de phase III en population clinique. Un Lasègue négatif oriente contre une radiculopathie, un Lasègue positif ne la confirme pas.", m:[["Se","89 %",1],["Sp","25 %"],["LR+","1,19"],["LR−","0,44"]], s:"montaner"},

         {n:"Étirement du nerf fémoral (Léri)", h:"Patient à plat ventre, flexion du genou. Positif si douleur à la face antérieure de cuisse : racines L2 à L4.", m:[["LR+","≥ 5",1]], s:"suri11"},
         {n:"Examen neurologique (sensibilité, force, réflexes)", h:"Dermatomes, myotomes et réflexes rotulien (L4) et achilléen (S1). Chaque élément seul est peu précis : c'est l'ensemble qui oriente.", m:[["Se sensibilité","61 %"],["Sp sensibilité","63 %"]], s:"tawa"}],
  body:[["Grader la douleur neuropathique",["Douleur radiculaire : douleur de jambe dans un territoire de racine, sans déficit.","Radiculopathie : en plus, déficit sensitif, moteur ou réflexe dans le même territoire.","Le Lasègue et le slump testent la mécanosensibilité du nerf, pas la présence d'une hernie à l'IRM."]],["Interprétation",["Aucun test isolé ne suffit : l'histoire (douleur de jambe sous le genou, territoire précis) compte autant que les tests.","Lasègue négatif : radiculopathie moins probable. Lasègue croisé positif : hernie discale plus probable."]]],
  alert:"Déficit moteur important (pied tombant) ou qui s'aggrave, signes bilatéraux ou troubles sphinctériens : avis médical urgent, retour à la question 1.",
  src:["windt","montaner","majlesi","pesonen","suri11","tawa"]},

const W = 2000, H = 3000;
const world = document.getElementById("world");
const svg = document.getElementById("edges");

const byId = Object.fromEntries(N.map(n=>[n.id,n]));
const KIND = {start:"Départ",question:"Question",outcome:"Tableau clinique",danger:"Orientation médicale",sub:"Sous-classification"};

N.forEach(n=>{
  const el = document.createElement("button");
  el.className = "node "+n.kind;
  el.style.left = n.x+"px"; el.style.top = n.y+"px";
  el.dataset.id = n.id;
  const firstStat = (n.tests||[]).flatMap(t=>t.m||[]).find(m=>m[2]);
  el.innerHTML = `<div class="k"><i></i>${n.k}</div><h3>${n.title}</h3>${n.p?`<p>${n.p}</p>`:""}${n.tests?`<div class="stat">${n.tests.length} test${n.tests.length>1?"s":""} · valeurs diagnostiques</div>`:""}`;
  el.addEventListener("click", ev=>{ if(moved) return; select(n.id,true); });
  world.appendChild(el);
  n.el = el;
});

function box(n){ return {x:n.x, y:n.y, w:n.el.offsetWidth, h:n.el.offsetHeight}; }
function drawEdges(){
  svg.innerHTML = "";
  E.forEach((e,i)=>{
    const a = box(byId[e[0]]), b = box(byId[e[1]]);
    let x1,y1,x2,y2,d;
    const horiz = Math.abs(a.y-b.y) < 40;
    if(horiz){
      const dir = b.x > a.x ? 1 : -1;
      x1 = a.x + dir*a.w/2; y1 = a.y; x2 = b.x - dir*b.w/2; y2 = b.y;
      d = `M${x1},${y1} L${x2},${y2}`;
    } else {
      x1 = a.x; y1 = a.y + a.h/2; x2 = b.x; y2 = b.y - b.h/2;
      const my = (y1+y2)/2;
      d = `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`;
    }
    const p = document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d",d); p.dataset.e = i; svg.appendChild(p);
    // flèche
    const ang = horiz ? (x2 > x1 ? 0 : 180) : 90;
    const ar = document.createElementNS("http://www.w3.org/2000/svg","path");
    ar.setAttribute("d","M-7,-5 L0,0 L-7,5"); ar.setAttribute("transform",`translate(${x2},${y2}) rotate(${ang})`);
    ar.dataset.e = i; svg.appendChild(ar);
    if(e[2] && e[2]!=="sub"){
      const g = document.createElementNS("http://www.w3.org/2000/svg","g"); g.dataset.e = i;
      const lx = horiz ? (x1+x2)/2 : (x1+x2)/2, ly = horiz ? y1 : (y1+y2)/2;
      const yes = e[2]==="Oui";
      g.innerHTML = `<rect class="lbl-bg" x="${lx-22}" y="${ly-11}" width="44" height="22" rx="11"/><text x="${lx}" y="${ly+4}" text-anchor="middle" class="${yes?"yes":"no"}">${e[2]}</text>`;
      svg.appendChild(g);
    }
  });
}

/* ---------- Pan / zoom ---------- */
let s = 1, tx = 0, ty = 0;
function apply(anim){
  world.style.transition = anim ? "transform .55s cubic-bezier(.2,.8,.2,1)" : "none";
  world.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
}
function clampS(v){ return Math.min(1.8, Math.max(.1, v)); }
function zoomAt(f, cx, cy, anim){
  const ns = clampS(s*f); const k = ns/s;
  tx = cx - (cx - tx)*k; ty = cy - (cy - ty)*k; s = ns; apply(anim);
}
function fit(anim){
  const r = stage.getBoundingClientRect();
  if(r.width < 720){ s = clampS(r.width/700); tx = r.width/2 - 1000*s; ty = 24 - 20*s; apply(anim); return; }
  const minX=40, minY=20, maxX=1880, maxY=2810;
  s = clampS(Math.min(r.width/(maxX-minX), r.height/(maxY-minY)) * .96);
  tx = (r.width - (maxX-minX)*s)/2 - minX*s;
  ty = (r.height - (maxY-minY)*s)/2 - minY*s;
  apply(anim);
}
function focusNode(id){
  const n = byId[id], r = stage.getBoundingClientRect();
  const panelW = window.innerWidth > 720 ? Math.min(440, r.width) : 0;
  const panelH = window.innerWidth <= 720 ? r.height*.68 : 0;
  s = Math.max(s, .75);
  tx = (r.width - panelW)/2 - n.x*s;
  ty = (r.height - panelH)/2 - n.y*s;
  apply(true);
}

const pts = new Map(); let moved = false, start = null, pinch = null;
stage.addEventListener("pointerdown", e=>{
  if(e.target.closest(".ctrl,.legend")) return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  moved = false; start = {x:e.clientX,y:e.clientY,tx,ty};
  if(pts.size===2){ const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y), s}; }
});
stage.addEventListener("pointermove", e=>{
  if(!pts.has(e.pointerId)) return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r = stage.getBoundingClientRect();
  if(pts.size===2 && pinch){
    const [a,b]=[...pts.values()];
    const d = Math.hypot(a.x-b.x,a.y-b.y);
    zoomAt((pinch.s*d/pinch.d)/s, (a.x+b.x)/2 - r.left, (a.y+b.y)/2 - r.top);
    if(!moved){ try{stage.setPointerCapture(e.pointerId);}catch(_){} } moved = true; return;
  }
  const dx = e.clientX-start.x, dy = e.clientY-start.y;
  if(Math.abs(dx)+Math.abs(dy) > 5){ if(!moved){ try{stage.setPointerCapture(e.pointerId);}catch(_){} } moved = true; stage.classList.add("dragging"); hideHint(); }
  if(moved){ tx = start.tx+dx; ty = start.ty+dy; apply(); }
});
function up(e){ pts.delete(e.pointerId); if(pts.size<2) pinch=null; stage.classList.remove("dragging");
  if(pts.size===1){ const p=[...pts.values()][0]; start={x:p.x,y:p.y,tx,ty}; }
  setTimeout(()=>{ if(!pts.size) moved=false; },0); }
stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
stage.addEventListener("wheel", e=>{ e.preventDefault(); hideHint();
  const r = stage.getBoundingClientRect();
  zoomAt(Math.exp(-e.deltaY*0.0015), e.clientX-r.left, e.clientY-r.top);

document.getElementById("zout").onclick = ()=>{ const r=stage.getBoundingClientRect(); zoomAt(.8,r.width/2,r.height/2,true); };

let hintT; function hideHint(){ const h=document.getElementById("hint"); h.style.opacity=0; }

/* ---------- Sélection & panneau ---------- */
const parents = {}; E.forEach(e=>{ (parents[e[1]] ||= []).push(e[0]); });
function pathTo(id){ const p=[id]; let c=id; while(parents[c]){ c=parents[c][0]; p.unshift(c);} return p; }
const panel = document.getElementById("panel");
let current = null;

function metricHTML(m){ return `<span class="metric${m[2]?" good":""}"><em>${m[0]}</em>${m[1]}</span>`; }
function srcHTML(k){ const o=SRC[k]; return `<li>${o.t}, ${o.y}${NOW-o.y>10?`<span class="old">étude fondatrice &gt;10 ans</span>`:""}</li>`; }

function select(id, focus){
  current = id;
  const n = byId[id], path = pathTo(id);
  document.querySelectorAll(".node").forEach(el=>{
    el.classList.toggle("sel", el.dataset.id===id);
    el.classList.toggle("path", path.includes(el.dataset.id) && el.dataset.id!==id);
  });
  const onEdges = new Set(); E.forEach((e,i)=>{ const ia=path.indexOf(e[0]); if(ia>=0 && path[ia+1]===e[1]) onEdges.add(String(i)); });
  svg.querySelectorAll("[data-e]").forEach(el=>el.classList.toggle("on", onEdges.has(el.dataset.e)));

  document.getElementById("crumbs").innerHTML = path.slice(0,-1).map(p=>`<button data-go="${p}">${byId[p].title}</button>`).join("<span>›</span>");
  const kc = {start:"var(--teal)",question:"var(--sand)",outcome:"var(--teal)",danger:"var(--coral)",sub:"var(--violet)"}[n.kind];
  const pk = document.getElementById("pkind"); pk.textContent = n.k; pk.style.color = kc;
  document.getElementById("ptitle").textContent = n.title;

  let h = "";
  if(n.p) h += `<p>${n.p}</p>`;
  if(n.alert) h += `<div class="alert">${n.alert}</div>`;
  if(n.tests) h += `<section><h4>Tests & valeurs diagnostiques</h4>${n.tests.map(t=>`<div class="test"><b>${t.n}</b><p>${t.h}</p>${t.m?`<div class="metrics">${t.m.map(metricHTML).join("")}</div>`:""}</div>`).join("")}</section>`;
  (n.body||[]).forEach(([t,items])=>{ h += `<section><h4>${t}</h4><ul>${items.map(i=>`<li>${i}</li>`).join("")}</ul></section>`; });
  const outs = E.filter(e=>e[0]===id);
  if(outs.length) h += `<section><h4>${n.kind==="question"?"Ta réponse":"Suite du raisonnement"}</h4><div class="next">${outs.map(e=>{
      const cls = e[2]==="Oui"?"yes":e[2]==="Non"?"no":"sub"; const lab = e[2]==="sub"?"Type":(e[2]||"Suite");
      return `<button class="go" data-go="${e[1]}"><span class="tag ${e[2]?cls:"yes"}">${lab}</span><span>${byId[e[1]].title}</span></button>`; }).join("")}</div></section>`;
  if(n.src) h += `<section class="src"><h4>Sources</h4><ul>${n.src.map(srcHTML).join("")}</ul></section>`;
  h += `<p class="disclaimer">Outil pédagogique d'aide au raisonnement clinique. Il ne remplace ni l'examen ni le jugement du praticien.</p>`;
  const body = document.getElementById("pbody"); body.innerHTML = h; body.scrollTop = 0;
  panel.classList.add("open");
  if(focus) focusNode(id);
  try{ history.replaceState(null,"","#"+id); }catch(_){}
}
panel.addEventListener("click", e=>{ const b=e.target.closest("[data-go]"); if(b) select(b.dataset.go,true); });
document.getElementById("close").onclick = ()=>{ panel.classList.remove("open"); document.querySelectorAll(".node.sel,.node.path").forEach(el=>el.classList.remove("sel","path")); svg.querySelectorAll(".on").forEach(el=>el.classList.remove("on")); current=null; };
document.addEventListener("keydown", e=>{ if(e.key==="Escape") document.getElementById("close").click(); });

/* ---------- Recherche ---------- */
const norm = t=>t.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const index = N.map(n=>({id:n.id, txt:norm([n.title,n.k,n.p,(n.tests||[]).map(t=>t.n+" "+t.h).join(" "),(n.body||[]).flat(2).join(" ")].join(" "))}));
const q = document.getElementById("q");
q.addEventListener("input", ()=>{
  const v = norm(q.value.trim());
  document.querySelectorAll(".node").forEach(el=>el.classList.remove("hit"));
  if(!v){ stage.classList.remove("dim"); return; }
  const hits = index.filter(i=>i.txt.includes(v)).map(i=>i.id);
  stage.classList.toggle("dim", true);
  hits.forEach(id=>byId[id].el.classList.add("hit"));
});
q.addEventListener("keydown", e=>{ if(e.key==="Enter"){ const h=document.querySelector(".node.hit"); if(h){ select(h.dataset.id,true); } } });

/* ---------- Démarrage ---------- */
function init(){
  drawEdges(); fit(false);
  const h = (location.hash||"").slice(1);
  if(byId[h]) setTimeout(()=>select(h,true),300);
  setTimeout(hideHint, 6000);
}
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(init); } else { window.addEventListener("load", init); }
window.addEventListener("resize", ()=>{ if(!current) fit(false); });
</script>
