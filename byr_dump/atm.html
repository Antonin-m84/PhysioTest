<style>
html,body{margin:0}
/* Layout: plein écran, canvas zoomable infini + barre haute + panneau détail latéral (feuille basse sur mobile). Thème sombre unique, choisi. */
:root{
  color-scheme: dark;
  --ink:#0c1316;        /* fond : anthracite bleuté */
  --ink-2:#121c20;      /* surfaces */
  --ink-3:#1a272c;      /* surfaces hautes */
  --line:#2a3a40;       /* traits */
  --fg:#e7efee;         /* texte */
  --fg-dim:#8fa3a3;     /* texte secondaire */
  --teal:#5fd3c3;       /* accent principal */
  --teal-deep:#1f5c56;
  --sand:#e6c58f;       /* décision / question */
  --coral:#ff7a6b;      /* red flag / urgence */
  --violet:#a99cf2;     /* sous-classification */
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body:"Manrope", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
html,body{height:100%;overflow:hidden}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-size:14px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

.app{position:relative;height:100%;display:flex;flex-direction:column}

/* ---------- Barre haute ---------- */
.top{position:relative;z-index:20;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,rgba(12,19,22,.96),rgba(12,19,22,.82));border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--teal);color:var(--ink);font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:-.02em}
.brand-name{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand-name span{color:var(--teal)}
.regions{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
.regions::-webkit-scrollbar{display:none}
.reg{flex:none;border:1px solid transparent;background:none;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--fg-dim);cursor:pointer}
a.reg{text-decoration:none;display:inline-flex;align-items:center}
a.reg:hover{color:var(--fg)}
.reg[aria-current="true"]{background:var(--ink-3);border-color:var(--line);color:var(--fg)}
.reg[disabled]{cursor:not-allowed;opacity:.55}
.reg small{font-family:var(--mono);font-size:10px;color:var(--fg-dim);margin-left:4px;letter-spacing:.04em}
.search{position:relative;flex:0 1 240px;min-width:160px}
.search input{width:100%;background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px 8px 32px;color:var(--fg);font:inherit;font-size:13px}
.search input::placeholder{color:var(--fg-dim)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--fg-dim)}

/* ---------- Canvas ---------- */
.stage{position:relative;flex:1;overflow:hidden;cursor:grab;touch-action:none;
  background-color:var(--ink);
  background-image:radial-gradient(circle at 1px 1px, rgba(95,211,195,.09) 1px, transparent 0);
  background-size:28px 28px}
.stage.dragging{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.edges path{fill:none;stroke:var(--line);stroke-width:2;transition:stroke .25s,opacity .25s}
.edges path.on{stroke:var(--teal);stroke-width:2.6}
.edges text{fill:var(--fg-dim);font-family:var(--mono);font-size:12px;font-weight:500}
.edges .lbl-bg{fill:var(--ink);stroke:var(--line);stroke-width:1}
.edges .yes{fill:var(--teal)}
.edges .no{fill:var(--coral)}
.edges g.on .lbl-bg{stroke:var(--teal)}

.node{position:absolute;transform:translate(-50%,-50%);width:250px;padding:14px 16px 14px;border-radius:14px;background:var(--ink-2);border:1px solid var(--line);
  cursor:pointer;text-align:left;transition:border-color .2s,box-shadow .2s,opacity .25s,transform .2s;user-select:none}
.node:hover{border-color:var(--fg-dim)}
.node .k{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-dim);margin-bottom:6px}
.node .k i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.node h3{margin:0;font-family:var(--display);font-weight:700;font-size:17px;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.node p{margin:6px 0 0;color:var(--fg-dim);font-size:12.5px;line-height:1.4}
.node .stat{margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--teal)}
.node.start{background:var(--teal);border-color:var(--teal);color:var(--ink);width:270px}
.node.start .k,.node.start p,.node.start .stat{color:rgba(12,19,22,.7)}
.node.question{border-color:rgba(230,197,143,.45)}
.node.question .k{color:var(--sand)}
.node.outcome{border-color:rgba(95,211,195,.5);background:linear-gradient(160deg,#14292a,var(--ink-2) 70%)}
.node.outcome .k{color:var(--teal)}
.node.danger{border-color:rgba(255,122,107,.6);background:linear-gradient(160deg,#2a1716,var(--ink-2) 70%)}
.node.danger .k{color:var(--coral)}
.node.sub{width:220px;border-style:dashed;border-color:rgba(169,156,242,.45)}
.node.sub .k{color:var(--violet)}
.node.sub h3{font-size:15px}
.node.sel{box-shadow:0 0 0 2px var(--teal),0 12px 40px rgba(0,0,0,.5);border-color:var(--teal)}
.node.path{border-color:var(--teal)}
.dim .node:not(.hit){opacity:.22}
.dim .edges path,.dim .edges g{opacity:.25}
.node.hit{box-shadow:0 0 0 2px var(--sand)}

/* ---------- Contrôles ---------- */
.ctrl{position:absolute;z-index:15;left:max(16px,calc(env(safe-area-inset-left,0px) + 16px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.ctrl button{width:40px;height:40px;border-radius:10px;background:var(--ink-2);border:1px solid var(--line);cursor:pointer;display:grid;place-items:center;font-size:18px}
.ctrl button:hover{border-color:var(--teal)}
.legend{position:absolute;z-index:15;left:max(72px,calc(env(safe-area-inset-left,0px) + 72px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;flex-wrap:wrap;
  padding:8px 12px;border-radius:10px;background:rgba(18,28,32,.9);border:1px solid var(--line);font-size:12px;color:var(--fg-dim);max-width:calc(100% - 100px)}
.legend span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.hint{position:absolute;z-index:15;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));padding:6px 12px;border-radius:999px;background:rgba(18,28,32,.9);border:1px solid var(--line);color:var(--fg-dim);font-size:12px;white-space:nowrap;transition:opacity .6s}

/* ---------- Panneau ---------- */
.panel{position:absolute;z-index:30;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--ink-2);border-left:1px solid var(--line);
  display:flex;flex-direction:column;transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:-20px 0 60px rgba(0,0,0,.35)}
.panel.open{transform:none}
.p-head{padding:20px 22px 14px;padding-right:max(22px,calc(env(safe-area-inset-right,0px) + 22px));border-bottom:1px solid var(--line)}
.p-close{position:absolute;top:14px;right:max(14px,calc(env(safe-area-inset-right,0px) + 14px));width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--ink);cursor:pointer;font-size:16px}
.crumbs{display:flex;flex-wrap:wrap;gap:4px 6px;font-size:11.5px;color:var(--fg-dim);margin:0 40px 10px 0}
.crumbs button{background:none;border:0;padding:0;color:var(--fg-dim);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.crumbs button:hover{color:var(--teal)}
.p-kind{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.p-title{margin:6px 0 0;font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
.p-body{flex:1;overflow-y:auto;padding:18px 22px 28px;padding-right:max(22px,calc(env(safe-area-inset-right,0px) + 22px));display:flex;flex-direction:column;gap:22px}
.p-body h4{margin:0 0 10px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-dim);font-weight:500}
.p-body p,.p-body li{line-height:1.55;font-size:14px;max-width:62ch}
.p-body p{margin:0}
.p-body ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.test{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--ink)}
.test + .test{margin-top:8px}
.test b{font-family:var(--display);font-size:15px;font-weight:700}
.test p{color:var(--fg-dim);font-size:13px;margin-top:4px}
.metrics{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.metric{font-family:var(--mono);font-size:11.5px;padding:3px 8px;border-radius:6px;background:var(--ink-3);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.metric em{font-style:normal;color:var(--fg-dim);margin-right:4px}
.metric.good{border-color:var(--teal-deep);color:var(--teal)}
.next{display:flex;flex-direction:column;gap:8px}
.go{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--ink);cursor:pointer;transition:border-color .2s,background .2s}
.go:hover{border-color:var(--teal);background:#10201f}
.go .tag{flex:none;font-family:var(--mono);font-size:11px;font-weight:500;padding:3px 8px;border-radius:6px;min-width:44px;text-align:center}
.go .tag.yes{background:rgba(95,211,195,.14);color:var(--teal)}
.go .tag.no{background:rgba(255,122,107,.14);color:var(--coral)}
.go .tag.sub{background:rgba(169,156,242,.14);color:var(--violet)}
.go span:last-child{font-weight:600;font-size:13.5px}
.src li{font-size:12.5px;color:var(--fg-dim)}
.old{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:5px;border:1px solid rgba(230,197,143,.4);color:var(--sand);margin-left:6px;white-space:nowrap}
.alert{border-left:3px solid var(--coral);padding:10px 12px;background:rgba(255,122,107,.07);border-radius:0 10px 10px 0;font-size:13.5px;line-height:1.5}
.disclaimer{font-size:11.5px;color:var(--fg-dim);border-top:1px solid var(--line);padding-top:14px}

@media (max-width:720px){
  .search{flex:1 1 100%;order:3}
  .panel{top:auto;width:100%;height:68%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(104%)}
  .panel.open{transform:none}
  .p-body{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
  .legend{display:none}
  .hint{font-size:11px;white-space:normal;max-width:220px;border-radius:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

    <button class="node start" data-id="start" style="left: 1000px; top: 80px;"><div class="k"><i></i>Point d'entrée</div><h3>Douleur ou gêne de la mâchoire</h3><p>Douleur de la mâchoire, de la tempe ou devant l'oreille, bruits articulaires, blocage.</p><div class="stat">1 test · valeurs diagnostiques</div></button><button class="node question" data-id="rf" style="left: 1000px; top: 260px;"><div class="k"><i></i>Question 1</div><h3>Drapeaux rouges ?</h3><p>Douleur non mécanique, signes généraux, déficit neurologique, plus de 50 ans avec céphalée récente.</p><div class="stat">1 test · valeurs diagnostiques</div></button><button class="node danger" data-id="rfEnd" style="left: 1500px; top: 260px;"><div class="k"><i></i>Orientation</div><h3>Orientation médicale</h3><p>Urgence si artérite suspectée ou douleur cardiaque, dentiste ou ORL si origine dentaire ou infectieuse.</p></button><button class="node sub" data-id="rfS1" style="left: 1310px; top: 450px;"><div class="k"><i></i>Plus de 50 ans</div><h3>Artérite à cellules géantes</h3><p>Céphalée récente, claudication de la mâchoire, troubles visuels : urgence médicale.</p></button><button class="node sub" data-id="rfS2" style="left: 1550px; top: 450px;"><div class="k"><i></i>Nerf</div><h3>Névralgie du trijumeau</h3><p>Décharges électriques de quelques secondes, zone gâchette au toucher. Pas mécanique : avis médical.</p></button><button class="node sub" data-id="rfS3" style="left: 1790px; top: 450px;"><div class="k"><i></i>Dent, sinus</div><h3>Origine dentaire ou ORL</h3><p>Douleur dentaire, sensibilité au chaud ou au froid, fièvre, gonflement : dentiste ou ORL.</p></button><button class="node sub" data-id="rfS4" style="left: 2030px; top: 450px;"><div class="k"><i></i>À l'effort</div><h3>Douleur cardiaque projetée</h3><p>Douleur de mâchoire déclenchée par l'effort, avec douleur thoracique ou du bras : urgence.</p></button><button class="node question" data-id="my" style="left: 1000px; top: 470px;"><div class="k"><i></i>Question 2</div><h3>Myalgie ?</h3><p>Douleur des muscles masticateurs (masséter, temporal), modifiée par la mâchoire.</p><div class="stat">2 tests · valeurs diagnostiques</div></button><button class="node outcome" data-id="myEnd" style="left: 520px; top: 470px;"><div class="k"><i></i>Tableau clinique</div><h3>Myalgie</h3><p>Préciser le type avec la palpation de 5 s.</p></button><button class="node sub" data-id="myS1" style="left: 160px; top: 660px;"><div class="k"><i></i>Douleur locale</div><h3>Myalgie locale</h3><p>La douleur reste sous le doigt pendant la palpation de 5 s.</p></button><button class="node sub" data-id="myS2" style="left: 400px; top: 660px;"><div class="k"><i></i>Diffusion</div><h3>Douleur myofasciale</h3><p>La douleur diffuse dans le muscle, sans dépasser ses limites.</p></button><button class="node sub" data-id="myS3" style="left: 640px; top: 660px;"><div class="k"><i></i>Projection</div><h3>Douleur myofasciale avec projection</h3><p>La douleur se projette au-delà du muscle (dent, oreille, œil). Critères : Se 86 %, Sp 98 %.</p></button><button class="node question" data-id="ar" style="left: 1000px; top: 760px;"><div class="k"><i></i>Question 3</div><h3>Arthralgie ?</h3><p>Douleur de l'articulation, devant l'oreille, modifiée par la mâchoire.</p><div class="stat">1 test · valeurs diagnostiques</div></button><button class="node outcome" data-id="arEnd" style="left: 1500px; top: 760px;"><div class="k"><i></i>Tableau clinique</div><h3>Arthralgie</h3><p>Douleur articulaire : éducation, mise au repos fonctionnel, mobilité progressive.</p></button><button class="node sub" data-id="arS1" style="left: 1500px; top: 950px;"><div class="k"><i></i>Si plusieurs articulations</div><h3>Arthrite inflammatoire</h3><p>Polyarthrite, spondylarthrite : raideur matinale, autres articulations touchées. Avis médical.</p></button><button class="node question" data-id="ce" style="left: 1000px; top: 1010px;"><div class="k"><i></i>Question 4</div><h3>Céphalée attribuée aux DTM ?</h3><p>Céphalée de la tempe, modifiée par la mâchoire, reproduite à l'examen.</p><div class="stat">1 test · valeurs diagnostiques</div></button><button class="node outcome" data-id="ceEnd" style="left: 520px; top: 1010px;"><div class="k"><i></i>Tableau clinique</div><h3>Céphalée attribuée aux DTM</h3><p>Traiter la myalgie ou l'arthralgie à l'origine, puis réévaluer la céphalée.</p></button><button class="node sub" data-id="ceS" style="left: 520px; top: 1200px;"><div class="k"><i></i>Autre céphalée associée</div><h3>Migraine ou céphalée de tension</h3><p>Peuvent coexister. Orienter vers le médecin si la céphalée domine le tableau.</p></button><button class="node question" data-id="dd" style="left: 1000px; top: 1290px;"><div class="k"><i></i>Question 5</div><h3>Déplacement discal ?</h3><p>Claquement à l'ouverture ou à la fermeture, blocage bouche fermée.</p><div class="stat">4 tests · valeurs diagnostiques</div></button><button class="node outcome" data-id="ddEnd" style="left: 1500px; top: 1290px;"><div class="k"><i></i>Tableau clinique</div><h3>Déplacement discal</h3><p>Sous-classifier selon la réduction et l'ouverture.</p></button><button class="node sub" data-id="ddS1" style="left: 1270px; top: 1480px;"><div class="k"><i></i>Claquement</div><h3>Avec réduction</h3><p>Claquement à l'ouverture et à la fermeture. Diagnostic clinique peu sensible (34 %).</p></button><button class="node sub" data-id="ddS2" style="left: 1510px; top: 1480px;"><div class="k"><i></i>Blocages qui cèdent</div><h3>Avec réduction et blocage intermittent</h3><p>Blocages passagers avec ouverture limitée, qui se débloquent seuls ou avec une manœuvre.</p></button><button class="node sub" data-id="ddS3" style="left: 1750px; top: 1480px;"><div class="k"><i></i>Moins de 40 mm</div><h3>Sans réduction, ouverture limitée</h3><p>Blocage bouche fermée, ouverture assistée inférieure à 40 mm. Valide sans imagerie.</p></button><button class="node sub" data-id="ddS4" style="left: 1990px; top: 1480px;"><div class="k"><i></i>40 mm ou plus</div><h3>Sans réduction, sans limitation</h3><p>Blocage dans le passé, ouverture récupérée. Peu fiable sans IRM.</p></button><button class="node question" data-id="dj" style="left: 1000px; top: 1580px;"><div class="k"><i></i>Question 6</div><h3>Atteinte dégénérative ?</h3><p>Crépitations (bruit de sable ou de gravier) pendant les mouvements.</p><div class="stat">1 test · valeurs diagnostiques</div></button><button class="node outcome" data-id="djEnd" style="left: 520px; top: 1580px;"><div class="k"><i></i>Tableau clinique</div><h3>Atteinte articulaire dégénérative</h3><p>Arthrose de l'ATM : éducation, mobilité, gestion de la charge.</p></button><button class="node sub" data-id="djS" style="left: 520px; top: 1770px;"><div class="k"><i></i>Évolution rapide</div><h3>Changement de l'occlusion</h3><p>Béance qui apparaît ou déviation progressive : avis spécialisé (résorption condylienne, inflammatoire).</p></button><button class="node question" data-id="sx" style="left: 1000px; top: 1870px;"><div class="k"><i></i>Question 7</div><h3>Subluxation ?</h3><p>Blocage bouche grande ouverte, besoin d'une manœuvre pour refermer.</p><div class="stat">1 test · valeurs diagnostiques</div></button><button class="node outcome" data-id="sxEnd" style="left: 1500px; top: 1870px;"><div class="k"><i></i>Tableau clinique</div><h3>Subluxation</h3><p>Hypermobilité : éducation et contrôle moteur de l'ouverture.</p></button><button class="node outcome" data-id="ax2" style="left: 1000px; top: 2150px;"><div class="k"><i></i>Toujours, en parallèle</div><h3>Axe II : profil psychosocial</h3><p>Intensité, retentissement, détresse, parafonctions : indispensable si la douleur dure.</p><div class="stat">2 tests · valeurs diagnostiques</div></button><button class="node sub" data-id="ax2S1" style="left: 880px; top: 2340px;"><div class="k"><i></i>GCPS</div><h3>Douleur chronique à fort retentissement</h3><p>Incapacité élevée : approche biopsychosociale, coordination avec le médecin.</p></button><button class="node sub" data-id="ax2S2" style="left: 1120px; top: 2340px;"><div class="k"><i></i>OBC</div><h3>Parafonctions</h3><p>Serrer, grincer, mâchonner : repérer, expliquer, travailler la prise de conscience.</p></button></div>

  src:["schiffman","gonzalez"]},

const E = [
 ["start","rf",""],
 ["rf","rfEnd","Oui"],["rf","my","Non"],
 ["rfEnd","rfS1","sub"],["rfEnd","rfS2","sub"],["rfEnd","rfS3","sub"],["rfEnd","rfS4","sub"],
 ["my","myEnd","Oui"],["my","ar","Non"],
 ["myEnd","myS1","sub"],["myEnd","myS2","sub"],["myEnd","myS3","sub"],
 ["ar","arEnd","Oui"],["ar","ce","Non"],
 ["arEnd","arS1","sub"],
 ["ce","ceEnd","Oui"],["ce","dd","Non"],
 ["ceEnd","ceS","sub"],
 ["dd","ddEnd","Oui"],["dd","dj","Non"],
 ["ddEnd","ddS1","sub"],["ddEnd","ddS2","sub"],["ddEnd","ddS3","sub"],["ddEnd","ddS4","sub"],
 ["dj","djEnd","Oui"],["dj","sx","Non"],
 ["djEnd","djS","sub"],
 ["sx","sxEnd","Oui"],["sx","ax2","Non"],
 ["ax2","ax2S1","sub"],["ax2","ax2S2","sub"],
];

/* ================= RENDU ================= */
const W = 2600, H = 1800;
const world = document.getElementById("world");
const svg = document.getElementById("edges");
const stage = document.getElementById("stage");
world.style.width = W+"px"; world.style.height = H+"px";
svg.setAttribute("width",W); svg.setAttribute("height",H);
const byId = Object.fromEntries(N.map(n=>[n.id,n]));
const KIND = {start:"Départ",question:"Question",outcome:"Tableau clinique",danger:"Orientation médicale",sub:"Sous-classification"};

N.forEach(n=>{
  const el = document.createElement("button");
  el.className = "node "+n.kind;
  el.style.left = n.x+"px"; el.style.top = n.y+"px";
  el.dataset.id = n.id;
  const firstStat = (n.tests||[]).flatMap(t=>t.m||[]).find(m=>m[2]);
  el.innerHTML = `<div class="k"><i></i>${n.k}</div><h3>${n.title}</h3>${n.p?`<p>${n.p}</p>`:""}${n.tests?`<div class="stat">${n.tests.length} test${n.tests.length>1?"s":""} · valeurs diagnostiques</div>`:""}`;
  el.addEventListener("click", ev=>{ if(moved) return; select(n.id,true); });
  world.appendChild(el);
  n.el = el;
});

function box(n){ return {x:n.x, y:n.y, w:n.el.offsetWidth, h:n.el.offsetHeight}; }
function drawEdges(){
  svg.innerHTML = "";
  E.forEach((e,i)=>{
    const a = box(byId[e[0]]), b = box(byId[e[1]]);
    let x1,y1,x2,y2,d;
    const horiz = Math.abs(a.y-b.y) < 40;
    if(horiz){
      const dir = b.x > a.x ? 1 : -1;
      x1 = a.x + dir*a.w/2; y1 = a.y; x2 = b.x - dir*b.w/2; y2 = b.y;
      d = `M${x1},${y1} L${x2},${y2}`;
    } else {
      x1 = a.x; y1 = a.y + a.h/2; x2 = b.x; y2 = b.y - b.h/2;
      const my = (y1+y2)/2;
      d = `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`;
    }
    const p = document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d",d); p.dataset.e = i; svg.appendChild(p);
    // flèche
    const ang = horiz ? (x2 > x1 ? 0 : 180) : 90;
    const ar = document.createElementNS("http://www.w3.org/2000/svg","path");
    ar.setAttribute("d","M-7,-5 L0,0 L-7,5"); ar.setAttribute("transform",`translate(${x2},${y2}) rotate(${ang})`);
    ar.dataset.e = i; svg.appendChild(ar);
    if(e[2] && e[2]!=="sub"){
      const g = document.createElementNS("http://www.w3.org/2000/svg","g"); g.dataset.e = i;
      const lx = horiz ? (x1+x2)/2 : (x1+x2)/2, ly = horiz ? y1 : (y1+y2)/2;
      const yes = e[2]==="Oui";
      g.innerHTML = `<rect class="lbl-bg" x="${lx-22}" y="${ly-11}" width="44" height="22" rx="11"/><text x="${lx}" y="${ly+4}" text-anchor="middle" class="${yes?"yes":"no"}">${e[2]}</text>`;
      svg.appendChild(g);
    }
  });
}

/* ---------- Pan / zoom ---------- */
let s = 1, tx = 0, ty = 0;
function apply(anim){
  world.style.transition = anim ? "transform .55s cubic-bezier(.2,.8,.2,1)" : "none";
  world.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
}
function clampS(v){ return Math.min(1.8, Math.max(.1, v)); }
function zoomAt(f, cx, cy, anim){
  const ns = clampS(s*f); const k = ns/s;
  tx = cx - (cx - tx)*k; ty = cy - (cy - ty)*k; s = ns; apply(anim);
}
function fit(anim){
  const r = stage.getBoundingClientRect();
  if(r.width < 720){ s = clampS(r.width/700); tx = r.width/2 - 1000*s; ty = 24 - 20*s; apply(anim); return; }
  const minX=0, minY=20, maxX=2300, maxY=2480;
  s = clampS(Math.min(r.width/(maxX-minX), r.height/(maxY-minY)) * .96);
  tx = (r.width - (maxX-minX)*s)/2 - minX*s;
  ty = (r.height - (maxY-minY)*s)/2 - minY*s;
  apply(anim);
}
function focusNode(id){
  const n = byId[id], r = stage.getBoundingClientRect();
  const panelW = window.innerWidth > 720 ? Math.min(440, r.width) : 0;
  const panelH = window.innerWidth <= 720 ? r.height*.68 : 0;
  s = Math.max(s, .75);
  tx = (r.width - panelW)/2 - n.x*s;
  ty = (r.height - panelH)/2 - n.y*s;
  apply(true);
}

const pts = new Map(); let moved = false, start = null, pinch = null;
stage.addEventListener("pointerdown", e=>{
  if(e.target.closest(".ctrl,.legend")) return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  moved = false; start = {x:e.clientX,y:e.clientY,tx,ty};
  if(pts.size===2){ const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y), s}; }
});
stage.addEventListener("pointermove", e=>{
  if(!pts.has(e.pointerId)) return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r = stage.getBoundingClientRect();
  if(pts.size===2 && pinch){
    const [a,b]=[...pts.values()];
    const d = Math.hypot(a.x-b.x,a.y-b.y);
    zoomAt((pinch.s*d/pinch.d)/s, (a.x+b.x)/2 - r.left, (a.y+b.y)/2 - r.top);
    if(!moved){ try{stage.setPointerCapture(e.pointerId);}catch(_){} } moved = true; return;
  }
  const dx = e.clientX-start.x, dy = e.clientY-start.y;
  if(Math.abs(dx)+Math.abs(dy) > 5){ if(!moved){ try{stage.setPointerCapture(e.pointerId);}catch(_){} } moved = true; stage.classList.add("dragging"); hideHint(); }
  if(moved){ tx = start.tx+dx; ty = start.ty+dy; apply(); }
});
function up(e){ pts.delete(e.pointerId); if(pts.size<2) pinch=null; stage.classList.remove("dragging");
  if(pts.size===1){ const p=[...pts.values()][0]; start={x:p.x,y:p.y,tx,ty}; }
  setTimeout(()=>{ if(!pts.size) moved=false; },0); }
stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
stage.addEventListener("wheel", e=>{ e.preventDefault(); hideHint();
  const r = stage.getBoundingClientRect();
  zoomAt(Math.exp(-e.deltaY*0.0015), e.clientX-r.left, e.clientY-r.top);
},{passive:false});
document.getElementById("zin").onclick = ()=>{ const r=stage.getBoundingClientRect(); zoomAt(1.25,r.width/2,r.height/2,true); };
document.getElementById("zout").onclick = ()=>{ const r=stage.getBoundingClientRect(); zoomAt(.8,r.width/2,r.height/2,true); };
document.getElementById("fit").onclick = ()=>fit(true);
let hintT; function hideHint(){ const h=document.getElementById("hint"); h.style.opacity=0; }

/* ---------- Sélection & panneau ---------- */
const parents = {}; E.forEach(e=>{ (parents[e[1]] ||= []).push(e[0]); });
function pathTo(id){ const p=[id]; let c=id; while(parents[c]){ c=parents[c][0]; p.unshift(c);} return p; }
const panel = document.getElementById("panel");
let current = null;

function metricHTML(m){ return `<span class="metric${m[2]?" good":""}"><em>${m[0]}</em>${m[1]}</span>`; }
function srcHTML(k){ const o=SRC[k]; return `<li>${o.t}, ${o.y}${NOW-o.y>10?`<span class="old">étude fondatrice &gt;10 ans</span>`:""}</li>`; }

function select(id, focus){
  current = id;
  const n = byId[id], path = pathTo(id);
  document.querySelectorAll(".node").forEach(el=>{
    el.classList.toggle("sel", el.dataset.id===id);
    el.classList.toggle("path", path.includes(el.dataset.id) && el.dataset.id!==id);
  });
  const onEdges = new Set(); E.forEach((e,i)=>{ const ia=path.indexOf(e[0]); if(ia>=0 && path[ia+1]===e[1]) onEdges.add(String(i)); });
  svg.querySelectorAll("[data-e]").forEach(el=>el.classList.toggle("on", onEdges.has(el.dataset.e)));

  document.getElementById("crumbs").innerHTML = path.slice(0,-1).map(p=>`<button data-go="${p}">${byId[p].title}</button>`).join("<span>›</span>");
  const kc = {start:"var(--teal)",question:"var(--sand)",outcome:"var(--teal)",danger:"var(--coral)",sub:"var(--violet)"}[n.kind];
  const pk = document.getElementById("pkind"); pk.textContent = n.k; pk.style.color = kc;
  document.getElementById("ptitle").textContent = n.title;

  let h = "";
  if(n.p) h += `<p>${n.p}</p>`;
  if(n.alert) h += `<div class="alert">${n.alert}</div>`;
  if(n.tests) h += `<section><h4>Tests & valeurs diagnostiques</h4>${n.tests.map(t=>`<div class="test"><b>${t.n}</b><p>${t.h}</p>${t.m?`<div class="metrics">${t.m.map(metricHTML).join("")}</div>`:""}</div>`).join("")}</section>`;
  (n.body||[]).forEach(([t,items])=>{ h += `<section><h4>${t}</h4><ul>${items.map(i=>`<li>${i}</li>`).join("")}</ul></section>`; });
  const outs = E.filter(e=>e[0]===id);
  if(outs.length) h += `<section><h4>${n.kind==="question"?"Ta réponse":"Suite du raisonnement"}</h4><div class="next">${outs.map(e=>{
      const cls = e[2]==="Oui"?"yes":e[2]==="Non"?"no":"sub"; const lab = e[2]==="sub"?"Type":(e[2]||"Suite");
      return `<button class="go" data-go="${e[1]}"><span class="tag ${e[2]?cls:"yes"}">${lab}</span><span>${byId[e[1]].title}</span></button>`; }).join("")}</div></section>`;
  if(n.src) h += `<section class="src"><h4>Sources</h4><ul>${n.src.map(srcHTML).join("")}</ul></section>`;
  h += `<p class="disclaimer">Outil pédagogique d'aide au raisonnement clinique. Il ne remplace ni l'examen ni le jugement du praticien.</p>`;
  const body = document.getElementById("pbody"); body.innerHTML = h; body.scrollTop = 0;
  panel.classList.add("open");
  if(focus) focusNode(id);
  try{ history.replaceState(null,"","#"+id); }catch(_){}
}
panel.addEventListener("click", e=>{ const b=e.target.closest("[data-go]"); if(b) select(b.dataset.go,true); });
document.getElementById("close").onclick = ()=>{ panel.classList.remove("open"); document.querySelectorAll(".node.sel,.node.path").forEach(el=>el.classList.remove("sel","path")); svg.querySelectorAll(".on").forEach(el=>el.classList.remove("on")); current=null; };
document.addEventListener("keydown", e=>{ if(e.key==="Escape") document.getElementById("close").click(); });

/* ---------- Recherche ---------- */
const norm = t=>t.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const index = N.map(n=>({id:n.id, txt:norm([n.title,n.k,n.p,(n.tests||[]).map(t=>t.n+" "+t.h).join(" "),(n.body||[]).flat(2).join(" ")].join(" "))}));
const q = document.getElementById("q");
q.addEventListener("input", ()=>{
  const v = norm(q.value.trim());
  document.querySelectorAll(".node").forEach(el=>el.classList.remove("hit"));
  if(!v){ stage.classList.remove("dim"); return; }
  const hits = index.filter(i=>i.txt.includes(v)).map(i=>i.id);
  stage.classList.toggle("dim", true);
  hits.forEach(id=>byId[id].el.classList.add("hit"));
});
q.addEventListener("keydown", e=>{ if(e.key==="Enter"){ const h=document.querySelector(".node.hit"); if(h){ select(h.dataset.id,true); } } });

/* ---------- Démarrage ---------- */
function init(){
  drawEdges(); fit(false);
  const h = (location.hash||"").slice(1);
  if(byId[h]) setTimeout(()=>select(h,true),300);
  setTimeout(hideHint, 6000);
}
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(init); } else { window.addEventListener("load", init); }
window.addEventListener("resize", ()=>{ if(!current) fit(false); });
</script>

    function nlSend(){
      var wrap=document.querySelector('.nl-wrap'),boxes=[];
      for(var i=0;i&lt;wrap.children.length;i++){
        var c=wrap.children[i];
        if(!c.offsetWidth||!c.offsetHeight)continue;
        boxes.push({x:c.offsetLeft-wrap.offsetLeft+8,
                    y:c.offsetTop-wrap.offsetTop+8,
                    w:c.offsetWidth,h:c.offsetHeight});
      }
      parent.postMessage({nlHud:'resize',
        width:wrap.offsetWidth+26,
        height:wrap.offsetHeight+26,
        boxes:boxes},'*');
    }
    function nlSendSoon(){requestAnimationFrame(nlSend);}
    window.addEventListener('load',nlSend);
    window.addEventListener('message',function(e){
      if(e.source!==parent||!e.data||e.data.nlHud!=='viewport')return;
      var s=document.documentElement.style;
      s.setProperty('--nl-vw',e.data.w+'px');
      s.setProperty('--nl-vh',e.data.h+'px');
      document.documentElement.classList.toggle('nl-narrow',e.data.w&lt;600);
      nlSendSoon();
    });
    var nlCoarse=window.matchMedia('(pointer: coarse)').matches;
    function nlSubmit(form){
      if(form.requestSubmit)return form.requestSubmit();
      if(form.checkValidity&amp;&amp;!form.checkValidity())
        return form.reportValidity&amp;&amp;form.reportValidity();
      form.submit();
    }
  
        var badge=document.getElementById('nl-badge'),card=document.getElementById('nl-card'),
            box=card.querySelector('textarea');
        function setOpen(open){
          card.classList.toggle('open',open);
          badge.setAttribute('aria-expanded',open?'true':'false');
          nlSendSoon();
          if(open&amp;&amp;!nlCoarse)box.focus();
        }
        box.addEventListener('keydown',function(e){
          if(e.key==='Enter'&amp;&amp;!e.shiftKey){e.preventDefault();nlSubmit(box.form);}
        });
        badge.addEventListener('click',function(){setOpen(!card.classList.contains('open'));});
        document.getElementById('nl-card-close').addEventListener('click',function(){setOpen(false);badge.focus();});
        document.addEventListener('keydown',function(e){
          if(e.key==='Escape'&amp;&amp;card.classList.contains('open')){setOpen(false);badge.focus();}
